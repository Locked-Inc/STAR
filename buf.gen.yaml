# buf.gen.yaml - STAR Code Generation Configuration (buf v1)
# Generates code for Go (primary), nanopb (C), and C++ (ROS2 bridge)
# Note: buf.gen.yaml v2 requires buf >= 1.32.0 (current: 1.28.1)
#
# STAR Project - Texas A&M University
# December 2025

version: v1

managed:
  enabled: true
  go_package_prefix:
    default: github.com/Locked-Inc/star-proto/gen/go
  optimize_for: SPEED

plugins:
  # ============================================
  # Go for star-gateway (primary language)
  # ============================================
  - plugin: buf.build/protocolbuffers/go
    out: star-proto/gen/go
    opt:
      - paths=source_relative

  - plugin: buf.build/grpc/go
    out: star-proto/gen/go
    opt:
      - paths=source_relative

  # ============================================
  # C for star-esp32-firmware (nanopb)
  # Note: nanopb requires local installation
  # Install: pip install nanopb
  # ============================================
  - plugin: nanopb
    out: star-proto/gen/nanopb
    opt:
      - --options-path=star-proto/nanopb/
    strategy: all

  # ============================================
  # C++ for star-ros2 (ROS2 bridge node)
  # Pinned to match Ubuntu 24.04 (ROS Jazzy):
  #   - protobuf 3.21.12 -> v21.12
  #   - grpc 1.51.1 -> v1.51.1
  # ============================================
  - plugin: buf.build/protocolbuffers/cpp:v21.12
    out: star-proto/gen/cpp

  - plugin: buf.build/grpc/cpp:v1.51.1
    out: star-proto/gen/cpp
