# STAR Robot AP DHCP Configuration
# Provides DHCP and DNS for ESP32 devices connecting to the hotspot

# Only listen on AP interface
interface=uap0
bind-interfaces

# DHCP range for ESP32 devices (192.168.4.10 - 192.168.4.100)
dhcp-range=192.168.4.10,192.168.4.100,255.255.255.0,24h

# Gateway (this Pi)
dhcp-option=option:router,192.168.4.1

# DNS servers (local + Google DNS)
dhcp-option=option:dns-server,192.168.4.1,8.8.8.8

# Local domain
domain=star.local

# Lease file location
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# Security settings
domain-needed
bogus-priv

# Don't read /etc/resolv.conf - use explicit upstream servers
no-resolv

# Upstream DNS servers
server=8.8.8.8
server=8.8.4.4

# Log DHCP transactions for debugging
log-dhcp
