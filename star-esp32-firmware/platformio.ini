; PlatformIO Project Configuration File
; ESP32 Firmware - Migrated from ESP-IDF
;
; Build environments for different ESP32 board variants

[platformio]
default_envs = esp32s3
src_dir = src
lib_dir = lib
test_dir = test
include_dir = include

; ============================================
; Common settings for all environments
; ============================================
[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
test_framework = unity
; Use deep LDF mode to resolve transitive dependencies from library.json
lib_ldf_mode = deep

; Build flags common to all environments
build_flags =
    -DSTAR_FIRMWARE_VERSION=\"1.0.0\"
    -DLOG_LOCAL_LEVEL=ESP_LOG_INFO
    ; Kconfig equivalents for star_bus component
    -DCONFIG_STAR_KCONFIG_BUS_MUTEX_TIMEOUT_MS=1000
    -DCONFIG_STAR_KCONFIG_BUS_MAX_NAME_LEN=32
    -DCONFIG_STAR_KCONFIG_BUS_DEFAULT_TIMEOUT_MS=1000
    -DCONFIG_STAR_KCONFIG_BUS_STATS_ENABLED=1

; ============================================
; ESP32-S3-WROOM-1-N16 (16MB Flash + 8MB PSRAM)
; ============================================
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions/partitions_16mb_ota.csv

; Core dependencies
lib_deps =
    nanopb/Nanopb@^0.4.8
    lib/star_core
    ; lib/star_error_handler  ; TODO: Not yet implemented
    lib/star_pin_validator
    lib/star_bus
    lib/star_arq
    lib/star_frame
    lib/star_sensor_ds18b20

build_flags =
    ${env.build_flags}
    -DCONFIG_STAR_BOARD_ESP32_S3_WROOM_1_N16=1
    -DBOARD_HAS_PSRAM
    ; Disable nanopb initializer warnings
    -Wno-missing-braces
    ; I2C defaults for ESP32-S3
    -DCONFIG_STAR_I2C_SDA_GPIO=8
    -DCONFIG_STAR_I2C_SCL_GPIO=9
    ; SPI defaults (COPI/CIPO terminology)
    -DCONFIG_STAR_SPI_COPI_GPIO=11
    -DCONFIG_STAR_SPI_CIPO_GPIO=13
    -DCONFIG_STAR_SPI_CLK_GPIO=12
    -DCONFIG_STAR_SPI_CS_GPIO=10
    ; 1-Wire DS18B20 temperature sensor
    -DCONFIG_STAR_DS18B20_DATA_GPIO=48
