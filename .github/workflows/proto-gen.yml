name: Protocol Buffer Generation

on:
  push:
    paths:
      - 'star-proto/proto/**/*.proto'
  pull_request:
    paths:
      - 'star-proto/proto/**/*.proto'

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install nanopb
        run: |
          pip install nanopb protobuf grpcio-tools

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Generate protocol buffers
        run: make proto-gen

      - name: Buf format check
        run: buf format proto --diff --exit-code
        working-directory: star-proto

      - name: Buf build
        run: buf build proto
        working-directory: star-proto

      - name: Buf lint
        run: buf lint proto
        working-directory: star-proto

      - name: Buf breaking against base branch
        if: github.event_name == 'pull_request'
        uses: bufbuild/buf-breaking-action@v1
        with:
          input: 'star-proto/proto'
          against: 'https://github.com/Locked-Inc/STAR.git#branch=${{ github.base_ref }},subdir=star-proto/proto'

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code star-proto/gen/ star-rx72n-firmware/lib/rx_nanopb/inc/gen/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-protos
          path: star-rx72n-firmware/lib/rx_nanopb/inc/gen/
