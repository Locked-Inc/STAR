name: Protocol Buffer Generation

on:
  push:
    paths:
      - 'star-proto/proto/**/*.proto'
      - '.github/workflows/proto-gen.yml'
  pull_request:
    paths:
      - 'star-proto/proto/**/*.proto'
      - '.github/workflows/proto-gen.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install nanopb
        run: pip install nanopb protobuf grpcio-tools

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99  # v1

      - name: Generate protocol buffers
        run: make proto-gen

      - name: Buf format check
        run: buf format proto --diff --exit-code
        working-directory: star-proto

      - name: Buf build
        run: buf build proto
        working-directory: star-proto

      - name: Buf lint
        run: buf lint proto
        working-directory: star-proto

      - name: Buf breaking against base branch
        if: github.event_name == 'pull_request'
        uses: bufbuild/buf-breaking-action@c57b3d842a5c3f3b454756ef65305a50a587c5ba  # v1
        with:
          input: 'star-proto/proto'
          against: 'https://github.com/Locked-Inc/STAR.git#branch=${{ github.base_ref }},subdir=star-proto/proto'

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code star-proto/gen/nanopb/star/v1/ star-rx72n-firmware/libs/rx_nanopb/inc/gen/star/v1/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: generated-protos
          path: star-rx72n-firmware/libs/rx_nanopb/inc/gen/
          retention-days: 7
