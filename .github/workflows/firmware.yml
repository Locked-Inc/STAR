name: RX72N Firmware

# Pull request validation is handled by dedicated modular workflows:
#   - firmware-unit-tests.yml   (Unity tests, clang-format, cppcheck, coverage)
#   - firmware-build-verify.yml (cross-compile with GNURX Docker image)
#   - firmware-toolchain-image.yml (builds ghcr.io/locked-inc/star/gnurx)
# This workflow only runs on direct push for fast post-merge sanity checks.
on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "e2-studio-star-rx72n-firmware/**"
      - ".github/workflows/firmware.yml"

jobs:
  # ---------------------------------------------------------------------------
  # Format check: all STAR-authored C/H files must pass clang-format
  # ---------------------------------------------------------------------------
  format-check:
    name: Clang-Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Check firmware formatting
        run: |
          bash e2-studio-star-rx72n-firmware/scripts/format_code.sh --check

  # ---------------------------------------------------------------------------
  # Unit tests: host-compiled via CMake + Unity (no cross-compiler required)
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests (host)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            build-essential \
            protobuf-compiler

      - name: Run unit tests
        run: |
          cd e2-studio-star-rx72n-firmware/tests
          bash run_tests.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-results-push-${{ github.sha }}
          path: e2-studio-star-rx72n-firmware/tests/build/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Binary build: cross-compile with GNURX toolchain (rx-elf-gcc)
  # Requires ghcr.io/locked-inc/star/gnurx image built by
  # firmware-toolchain-image.yml.  Marked continue-on-error so a toolchain
  # image rebuild does not block the push sanity checks.
  # ---------------------------------------------------------------------------
  build:
    name: Cross-Compile (GNURX)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    container:
      image: ghcr.io/locked-inc/star/gnurx:14.2.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: 'true'

      - name: Configure firmware (Release)
        working-directory: e2-studio-star-rx72n-firmware
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-rx72n.cmake

      - name: Build firmware (Release)
        working-directory: e2-studio-star-rx72n-firmware
        run: cmake --build build --parallel $(nproc)

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: firmware-release-push-${{ github.sha }}
          path: |
            e2-studio-star-rx72n-firmware/build/*.elf
            e2-studio-star-rx72n-firmware/build/*.mot
            e2-studio-star-rx72n-firmware/build/*.map
          retention-days: 30
