name: Firmware Cross-Compile Build Verify

# T2: cross-compile the full firmware with the GNURX toolchain and enforce
# binary size budgets.  Runs in the minimal GNURX Docker image (~400 MB)
# published to GHCR by firmware-toolchain-image.yml.
#
# Prerequisite: the ghcr.io/locked-inc/star/gnurx:14.2.0 image must exist in
# GHCR before this workflow can pass.  Trigger firmware-toolchain-image.yml
# manually via workflow_dispatch the first time, or push a change to
# docker/gnurx/Dockerfile.

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'e2-studio-star-rx72n-firmware/**'
      - '.github/workflows/firmware-build-verify.yml'
      - 'docker/gnurx/Dockerfile'
  pull_request:
    paths:
      - 'e2-studio-star-rx72n-firmware/**'
      - '.github/workflows/firmware-build-verify.yml'
      - 'docker/gnurx/Dockerfile'

# Cancel stale builds on fast-push branches -- only the latest commit matters.
# NOT applied to firmware-toolchain-image.yml to avoid corrupted partial pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Cross-Compile with GNURX
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read     # required to pull ghcr.io image

    container:
      # Pin to versioned tag so toolchain upgrades are explicit in git history.
      # Update to ghcr.io/locked-inc/star/gnurx:14.3.0 when GNURX upgrades.
      # Never pin to :latest -- a silent toolchain bump could change code gen
      # and break builds without any git-visible change on this repo.
      image: ghcr.io/locked-inc/star/gnurx:14.2.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure firmware (Release)
        working-directory: e2-studio-star-rx72n-firmware
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-rx72n.cmake \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build firmware
        working-directory: e2-studio-star-rx72n-firmware
        run: cmake --build build -j$(nproc)

      - name: Report and enforce binary size budgets
        working-directory: e2-studio-star-rx72n-firmware/build
        run: |
          rx-elf-size --format=berkeley star-rx72n-firmware.elf
          # --format=berkeley output: NR==1 is the header, NR==2 is the data row.
          # Fields: text  data  bss  dec  hex  filename
          TEXT=$(rx-elf-size --format=berkeley star-rx72n-firmware.elf | awk 'NR==2{print $1}')
          DATA=$(rx-elf-size --format=berkeley star-rx72n-firmware.elf | awk 'NR==2{print $2}')
          BSS=$(rx-elf-size  --format=berkeley star-rx72n-firmware.elf | awk 'NR==2{print $3}')
          # RX72N hardware limits: 4 MB Flash, 512 KB SRAM
          #   Flash usage = text + data  (data initializers copied from Flash at boot)
          #   SRAM usage  = data + bss   (data initialized + zero-init)
          FLASH_USED=$((TEXT + DATA))
          SRAM_USED=$((DATA + BSS))
          echo "Flash: ${FLASH_USED} / 4194304 bytes ($((FLASH_USED * 100 / 4194304))%)"
          echo "SRAM:  ${SRAM_USED}  / 524288  bytes ($((SRAM_USED  * 100 / 524288))%)"
          if [ "${FLASH_USED}" -gt "4194304" ]; then
            echo "ERROR: Flash budget exceeded (4 MB limit)" && exit 1
          fi
          if [ "${SRAM_USED}" -gt "524288" ]; then
            echo "ERROR: SRAM budget exceeded (512 KB limit)" && exit 1
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          # run_id guarantees uniqueness across manual re-runs of the same SHA
          name: star-firmware-${{ github.run_id }}-${{ github.sha }}
          path: |
            e2-studio-star-rx72n-firmware/build/star-rx72n-firmware.elf
            e2-studio-star-rx72n-firmware/build/star-rx72n-firmware.mot
            e2-studio-star-rx72n-firmware/build/star-rx72n-firmware.map
          retention-days: 7
