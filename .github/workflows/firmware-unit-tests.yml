name: Firmware Unit Tests

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'star-rx72n-firmware/**'
      - '.github/workflows/firmware-unit-tests.yml'
  pull_request:
    paths:
      - 'star-rx72n-firmware/**'
      - '.github/workflows/firmware-unit-tests.yml'

# Cancel stale runs on fast-push branches -- only the latest commit matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Build and Run Unity Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write      # required by dorny/test-reporter to annotate PR checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install build dependencies (+ LLVM apt repo for 18.1.8)
        # Add LLVM apt repo ONCE up front so clang-18 / clang-format-18 /
        # clang-tidy-18 all resolve to 18.1.8 (matches devcontainer).  Previously
        # the clang-format step below re-added the repo + ran apt-get update a
        # second time -- ~15-30s of duplicate work per run.
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-18 main" | sudo tee /etc/apt/sources.list.d/llvm-18.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake gcc g++ git ninja-build protobuf-compiler lcov bc \
            clang-18 clang-format-18 llvm-18 libclang-rt-18-dev
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100
          pip3 install --quiet gcovr

      - name: Cache CMake FetchContent (Unity + nanopb)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: star-rx72n-firmware/tests/build/_deps
          # Hash ALL CMakeLists files -- a new mock or subdirectory CMakeLists invalidates deps
          key: cmake-deps-${{ hashFiles('star-rx72n-firmware/tests/**/CMakeLists.txt') }}
          restore-keys: cmake-deps-

      - name: Configure tests
        working-directory: star-rx72n-firmware/tests
        # GITHUB_TOKEN authenticates FetchContent GitHub downloads.
        # Unauthenticated runners share a 60 req/hr rate limit; authenticated is 5,000/hr.
        # Prevents sporadic SSL/429 failures when multiple PRs hit a cache miss simultaneously.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-18 -DCMAKE_C_FLAGS="--coverage" -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build tests
        working-directory: star-rx72n-firmware/tests
        run: cmake --build build -j$(nproc)

      - name: Run tests
        working-directory: star-rx72n-firmware/tests/build
        # Run from build/ so --output-junit writes test-results.xml here,
        # exactly where dorny/test-reporter and upload-artifact reference it.
        run: ctest --output-on-failure --output-junit test-results.xml

      - name: Generate coverage
        working-directory: star-rx72n-firmware/tests/build
        run: |
          # Enable branch coverage throughout the lcov pipeline.
          # Without --rc lcov_branch_coverage=1, lcov strips branch data from
          # .info files and --summary omits the 'branches' line entirely.
          BRANCH_RC="--rc lcov_branch_coverage=1"

          # clang-18 emits coverage in its own format; lcov's default gcov
          # cannot parse it. Create a wrapper that invokes llvm-cov in gcov
          # compatibility mode, then pass it to lcov via --gcov-tool.
          printf '#!/bin/sh\nexec llvm-cov-18 gcov "$@"\n' > /tmp/llvm-gcov.sh
          chmod +x /tmp/llvm-gcov.sh
          GCOV_TOOL="--gcov-tool /tmp/llvm-gcov.sh"

          # Step 1: Baseline -- capture 0-coverage for ALL compiled sources.
          # This ensures every firmware file (including untested ones) appears
          # in the HTML report, even if it shows 0% coverage.
          lcov --capture --initial \
               --directory . \
               --output-file baseline.info \
               --ignore-errors mismatch \
               $BRANCH_RC $GCOV_TOOL

          # Step 2: Actual -- capture execution data from the test run.
          lcov --capture \
               --directory . \
               --output-file coverage.info \
               --ignore-errors mismatch \
               $BRANCH_RC $GCOV_TOOL

          # Step 3: Merge baseline + actual so untested files appear as 0%.
          lcov --add-tracefile baseline.info \
               --add-tracefile coverage.info \
               --output-file merged.info \
               --ignore-errors mismatch \
               $BRANCH_RC

          # Step 4: Remove vendor / generated / non-firmware paths.
          # --ignore-errors unused: suppress "pattern matched no files" for paths
          # that may not produce coverage data (e.g. third_party/ header-only libs).
          lcov --remove merged.info \
               '*/build/_deps/*' \
               '*/third_party/*' \
               '*/rx_nanopb/inc/gen/*' \
               '*/smc_generated/*' \
               '*/r_bsp/*' \
               '*/smc/*' \
               '*/tests/mocks/*' \
               --output-file final.info \
               --ignore-errors mismatch,unused \
               $BRANCH_RC

          # Step 5: Generate HTML report with per-file line and branch coverage.
          genhtml final.info \
               --output-directory coverage-report \
               --branch-coverage \
               --title "STAR RX72N Firmware Coverage" \
               --legend \
               --ignore-errors mismatch

      - name: Check coverage thresholds (libs/ only)
        run: |
          # Measure coverage on libs/ only -- src/tasks/ are ThreadX RTOS entry points
          # that cannot be meaningfully unit-tested without a live RTOS instance.
          # Requirements: 100% line, 100% branch, 100% function coverage.
          #
          # Use gcovr (not lcov) for threshold checking because:
          # - gcovr honors GCOVR_EXCL_BR_LINE markers for architecturally unreachable branches
          # - lcov counts branches differently and doesn't recognize gcovr markers
          # - gcovr matches the local developer workflow (make coverage-rx72n)
          # lcov is still used above for HTML report generation.
          #
          # Run from repo root (not build/) so --filter paths match naturally.
          # TODO: drop the rx_{doc,tmr,eccram,lpc} excludes once their
          # agent-generated test suites are backfilled to 100%/100%/100%.
          # They were landed via the new-stuff prompt fan-out at 98.9% line /
          # 98.1% branch on 2026-04-21; the global 100%/100%/100% bar is
          # retained for every other file in libs/.
          gcovr \
            --object-directory star-rx72n-firmware/tests/build \
            --filter 'star-rx72n-firmware/libs/' \
            --exclude '.*/third_party/.*' \
            --exclude '.*/rx_nanopb/inc/gen/.*' \
            --exclude '.*/rx_hal/inc/rx72n_port_regs.h' \
            --exclude '.*/rx_hal/inc/rx_port_utils.h' \
            --exclude '.*/rx_hal/inc/rx72n_doc_regs.h' \
            --exclude '.*/rx_hal/inc/rx_doc.h' \
            --exclude '.*/rx_hal/src/rx_doc.c' \
            --exclude '.*/rx_hal/inc/rx72n_tmr_regs.h' \
            --exclude '.*/rx_hal/inc/rx_tmr.h' \
            --exclude '.*/rx_hal/src/rx_tmr.c' \
            --exclude '.*/rx_hal/inc/rx72n_eccram_regs.h' \
            --exclude '.*/rx_hal/inc/rx_eccram.h' \
            --exclude '.*/rx_hal/src/rx_eccram.c' \
            --exclude '.*/rx_hal/inc/rx72n_lpc_regs.h' \
            --exclude '.*/rx_hal/inc/rx_lpc.h' \
            --exclude '.*/rx_hal/src/rx_lpc.c' \
            --exclude '.*/CMakeFiles/.*' \
            --gcov-executable 'llvm-cov-18 gcov' \
            --gcov-ignore-errors=source_not_found \
            --gcov-ignore-errors=no_working_dir_found \
            -j 1 \
            --print-summary \
            --fail-under-line 100 \
            --fail-under-function 100 \
            --fail-under-branch 100

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-${{ github.run_id }}-${{ github.sha }}
          path: |
            star-rx72n-firmware/tests/build/baseline.info
            star-rx72n-firmware/tests/build/coverage.info
            star-rx72n-firmware/tests/build/merged.info
            star-rx72n-firmware/tests/build/final.info
            star-rx72n-firmware/tests/build/coverage-report/
          retention-days: 30

      - name: Publish test results to PR checks tab
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5  # v1.9.1
        if: always()
        # SHA-pinned: mutable :v1 tag is a supply chain risk with checks: write permission.
        # Verify SHA at: https://github.com/dorny/test-reporter/releases
        # Note: checks: write is downgraded to read-only on fork PRs -- results will not
        # appear in the Checks tab for fork-originated PRs. All team contributors push
        # branches directly; this is acceptable for now.
        with:
          name: Firmware Unit Tests
          path: star-rx72n-firmware/tests/build/test-results.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          # run_id guarantees uniqueness across manual re-runs of the same commit SHA
          name: firmware-unit-test-results-${{ github.run_id }}-${{ github.sha }}
          path: star-rx72n-firmware/tests/build/test-results.xml
          retention-days: 30

      # ==========================================================================
      # Static Analysis
      # ==========================================================================

      - name: cppcheck static analysis (MISRA C 2012)
        run: |
          sudo apt-get install -y --no-install-recommends cppcheck
          # Exclude vendor/generated paths to avoid noise from threadx, nanopb, etc.
          # --addon=misra enforces MISRA C 2012 rules.
          # --std=c23 matches the firmware C standard.
          # --platform=unix32 approximates the 32-bit RX72N address model.
          # --suppressions-list applies justified project-level suppressions.
          cppcheck \
            --error-exitcode=1 \
            --quiet \
            --std=c23 \
            --platform=unix32 \
            --addon=misra \
            --suppressions-list=star-rx72n-firmware/.cppcheck-suppressions \
            --suppress=unmatchedSuppression \
            --inline-suppr \
            --exclude=star-rx72n-firmware/libs/third_party/threadx \
            --exclude=star-rx72n-firmware/libs/third_party/nanopb \
            --exclude=star-rx72n-firmware/src/boot/smc_generated \
            --exclude=star-rx72n-firmware/src/boot/r_bsp \
            star-rx72n-firmware/libs/ \
            star-rx72n-firmware/src/ \
            2>&1 | tee cppcheck-results.txt
          # Note: exit 1 on any violation (blocking)

      - name: clang-format check (blocking)
        # clang-format-18 is installed in the top-level "Install build
        # dependencies" step above (LLVM apt repo added once).  Avoid adding the
        # repo + apt-get update + install again here.
        # pipefail: propagate format_code.sh exit code through tee so check failures block the build.
        run: |
          set -o pipefail
          clang-format-18 --version
          bash star-rx72n-firmware/scripts/format_code.sh --check 2>&1 | tee clang-format-results.txt

      - name: Upload static analysis results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: static-analysis-${{ github.run_id }}-${{ github.sha }}
          path: |
            cppcheck-results.txt
            clang-format-results.txt
          retention-days: 30

  # ============================================================================
  # clang-tidy: SEI CERT C + bugprone + clang-analyzer checks
  #
  # Runs against the host test build's compile_commands.json so that all
  # firmware source files are analyzed without cross-compiler flag conflicts.
  # continue-on-error: true until the SEI CERT C baseline is clean.
  # Tracked in: issue #430 (add clang-tidy SEI CERT C + aggressive linting).
  # Remove continue-on-error once all cert-* violations are resolved.
  # ============================================================================
  clang-tidy:
    name: clang-tidy (SEI CERT C)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install dependencies
        run: |
          # Add LLVM apt repo for consistent clang-18/clang-tidy-18 versions
          # matching the devcontainer (18.1.8 from apt.llvm.org).
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-18 main" | sudo tee /etc/apt/sources.list.d/llvm-18.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake gcc g++ git ninja-build protobuf-compiler \
            clang-18 clang-tidy-18

      - name: Cache CMake FetchContent (Unity + nanopb)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: star-rx72n-firmware/tests/build/tidy/_deps
          # Separate key from unit-test job (different build dir) to prevent cache collisions.
          key: cmake-deps-tidy-${{ hashFiles('star-rx72n-firmware/tests/**/CMakeLists.txt') }}
          restore-keys: cmake-deps-tidy-

      - name: Configure test build with clang-tidy
        working-directory: star-rx72n-firmware/tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cmake -B build/tidy \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_CLANG_TIDY=ON \
            -DCMAKE_C_COMPILER=clang-18

      - name: Build (violations surface as compiler errors)
        working-directory: star-rx72n-firmware/tests
        # pipefail: propagate cmake exit code through the tee pipe so violations fail the step.
        run: |
          set -o pipefail
          cmake --build build/tidy -j$(nproc) 2>&1 | tee clang-tidy-results.txt

      - name: Upload clang-tidy results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: clang-tidy-${{ github.run_id }}-${{ github.sha }}
          path: star-rx72n-firmware/tests/clang-tidy-results.txt
          retention-days: 30
