name: Firmware Unit Tests

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'e2-studio-star-rx72n-firmware/**'
      - '.github/workflows/firmware-unit-tests.yml'
  pull_request:
    paths:
      - 'e2-studio-star-rx72n-firmware/**'
      - '.github/workflows/firmware-unit-tests.yml'

# Cancel stale runs on fast-push branches -- only the latest commit matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Build and Run Unity Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write      # required by dorny/test-reporter to annotate PR checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get install -y cmake gcc g++ git ninja-build

      - name: Cache CMake FetchContent (Unity + nanopb)
        uses: actions/cache@v4
        with:
          path: e2-studio-star-rx72n-firmware/tests/build/_deps
          # Hash ALL CMakeLists files -- a new mock or subdirectory CMakeLists invalidates deps
          key: cmake-deps-${{ hashFiles('e2-studio-star-rx72n-firmware/tests/**/CMakeLists.txt') }}
          restore-keys: cmake-deps-

      - name: Configure tests
        working-directory: e2-studio-star-rx72n-firmware/tests
        # GITHUB_TOKEN authenticates FetchContent GitHub downloads.
        # Unauthenticated runners share a 60 req/hr rate limit; authenticated is 5,000/hr.
        # Prevents sporadic SSL/429 failures when multiple PRs hit a cache miss simultaneously.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build tests
        working-directory: e2-studio-star-rx72n-firmware/tests
        run: cmake --build build -j$(nproc)

      - name: Run tests
        working-directory: e2-studio-star-rx72n-firmware/tests/build
        # Run from build/ so --output-junit writes test-results.xml here,
        # exactly where dorny/test-reporter and upload-artifact reference it.
        run: ctest --output-on-failure --output-junit test-results.xml

      - name: Publish test results to PR checks tab
        uses: dorny/test-reporter@31a54ee0be9676423175f2e2be4dac26b427f67e  # v1.9.1
        if: always()
        # SHA-pinned: mutable :v1 tag is a supply chain risk with checks: write permission.
        # Verify SHA at: https://github.com/dorny/test-reporter/releases
        # Note: checks: write is downgraded to read-only on fork PRs -- results will not
        # appear in the Checks tab for fork-originated PRs. All team contributors push
        # branches directly; this is acceptable for now.
        with:
          name: Firmware Unit Tests
          path: e2-studio-star-rx72n-firmware/tests/build/test-results.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # run_id guarantees uniqueness across manual re-runs of the same commit SHA
          name: firmware-unit-test-results-${{ github.run_id }}-${{ github.sha }}
          path: e2-studio-star-rx72n-firmware/tests/build/test-results.xml

      # ==========================================================================
      # Static Analysis (non-blocking -- promote to blocking after baseline clean)
      # ==========================================================================

      - name: cppcheck static analysis
        run: |
          sudo apt-get install -y cppcheck
          # Exclude vendor/generated paths to avoid noise from threadx, nanopb, etc.
          cppcheck --error-exitcode=0 --quiet \
            --suppress=missingInclude \
            --suppress=unmatchedSuppression \
            --inline-suppr \
            --exclude=e2-studio-star-rx72n-firmware/libs/threadx \
            --exclude=e2-studio-star-rx72n-firmware/libs/rx_nanopb/nanopb \
            --exclude=e2-studio-star-rx72n-firmware/src/boot/smc_generated \
            --exclude=e2-studio-star-rx72n-firmware/src/boot/r_bsp \
            e2-studio-star-rx72n-firmware/libs/ \
            e2-studio-star-rx72n-firmware/src/ \
            2>&1 | tee cppcheck-results.txt; true
          # TODO: remove --error-exitcode=0 and '; true' once baseline is clean

      - name: clang-format check
        run: |
          # No version suffix: devcontainer (osrf/ros:jazzy-desktop) and ubuntu-latest
          # both run Ubuntu 24.04 and install clang-format-18 via the unversioned package.
          sudo apt-get install -y clang-format
          find e2-studio-star-rx72n-firmware \
            \( -name '*.c' -o -name '*.h' \) \
            ! -path '*/build/*' \
            ! -path '*/threadx/*' \
            ! -path '*/nanopb/*' \
            ! -path '*/smc_generated/*' \
            ! -path '*/r_bsp/*' \
            | xargs clang-format --dry-run 2>&1 | tee clang-format-results.txt
          VIOLATIONS=$(wc -l < clang-format-results.txt)
          echo "clang-format violations: ${VIOLATIONS}"
          exit 0
          # TODO: remove 'exit 0' once baseline is clean

      - name: Upload static analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-${{ github.run_id }}-${{ github.sha }}
          path: |
            cppcheck-results.txt
            clang-format-results.txt
