name: STM32 Firmware Build Verify

# Cross-compile STM32 firmware for both supported chips (F767 and F746)
# with arm-none-eabi-gcc and enforce binary size budgets.
# Runs in the minimal STM32 Docker image published to GHCR.
#
# Prerequisite: the ghcr.io/locked-inc/star/stm32:10.3-2021.07 image must
# exist in GHCR before this workflow can pass.  Trigger
# stm32-toolchain-image.yml manually via workflow_dispatch the first time, or
# push a change to docker/stm32/Dockerfile.

on:
  push:
    branches: [main, 'adding-stm32-cicd', 'feature/**']
    paths:
      - 'star-stm32-firmware/**'
      - '.github/workflows/stm32-firmware.yml'
      - 'docker/stm32/Dockerfile'
      - '.gitmodules'
  pull_request:
    paths:
      - 'star-stm32-firmware/**'
      - '.github/workflows/stm32-firmware.yml'
      - 'docker/stm32/Dockerfile'
      - '.gitmodules'

# Cancel stale builds on fast-push branches -- only the latest commit matters.
# NOT applied to stm32-toolchain-image.yml to avoid corrupted partial pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Cross-Compile (${{ matrix.chip }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read     # required to pull ghcr.io image

    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: STM32F767xx
            build_dir: build-f767
            flash_limit: 2097152   # 2 MB
            sram_limit: 524288     # 512 KB
          - chip: STM32F746xx
            build_dir: build-f746
            flash_limit: 1048576   # 1 MB
            sram_limit: 327680     # 320 KB

    container:
      # Pin to versioned tag so toolchain upgrades are explicit in git history.
      # Update to :12.x when upgrading past Ubuntu 22.04 toolchain.
      # Never pin to :latest -- a silent toolchain bump could change code gen
      # and break builds without any git-visible change on this repo.
      image: ghcr.io/locked-inc/star/stm32:10.3-2021.07
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Install CA certificates + quality-gate tooling (one apt run)
        # Previously two separate apt-get calls (ca-certificates pre-checkout,
        # clang-format/libnewlib post-checkout).  A single apt-get saves one
        # index refresh + install cycle (~20-30s).
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends \
            ca-certificates clang-format libnewlib-arm-none-eabi
          update-ca-certificates

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: recursive

      - name: Configure firmware (${{ matrix.chip }}, Release)
        working-directory: star-stm32-firmware
        run: |
          cmake -B ${{ matrix.build_dir }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cubeide-gcc.cmake \
            -DSTM32_TARGET=${{ matrix.chip }} \
            -G Ninja

      - name: Run linters (format check mode)
        working-directory: star-stm32-firmware
        run: |
          find Sources -type f \( -name '*.c' -o -name '*.h' \) -print0 \
            | xargs -0 -r clang-format --dry-run --Werror

      - name: Build firmware
        working-directory: star-stm32-firmware
        run: cmake --build "${{ matrix.build_dir }}" --parallel "$(nproc)"

      - name: Run tests
        working-directory: star-stm32-firmware
        run: |
          ctest --test-dir ${{ matrix.build_dir }} --output-on-failure --no-tests=error

      - name: Report and enforce binary size budgets
        working-directory: star-stm32-firmware/${{ matrix.build_dir }}
        run: |
          arm-none-eabi-size --format=berkeley firmware.elf
          # --format=berkeley output: NR==1 is the header, NR==2 is the data row.
          # Fields: text  data  bss  dec  hex  filename
          TEXT=$(arm-none-eabi-size --format=berkeley firmware.elf | awk 'NR==2{print $1}')
          DATA=$(arm-none-eabi-size --format=berkeley firmware.elf | awk 'NR==2{print $2}')
          BSS=$(arm-none-eabi-size  --format=berkeley firmware.elf | awk 'NR==2{print $3}')
          FLASH_LIMIT=${{ matrix.flash_limit }}
          SRAM_LIMIT=${{ matrix.sram_limit }}
          #   Flash usage = text + data  (data initializers copied from Flash at boot)
          #   SRAM usage  = data + bss   (data initialized + zero-init)
          FLASH_USED=$((TEXT + DATA))
          SRAM_USED=$((DATA + BSS))
          echo "Chip:  ${{ matrix.chip }}"
          echo "Flash: ${FLASH_USED} / ${FLASH_LIMIT} bytes ($((FLASH_USED * 100 / FLASH_LIMIT))%)"
          echo "SRAM:  ${SRAM_USED}  / ${SRAM_LIMIT}  bytes ($((SRAM_USED  * 100 / SRAM_LIMIT))%)"
          if [ "${FLASH_USED}" -gt "${FLASH_LIMIT}" ]; then
            echo "ERROR: Flash budget exceeded" && exit 1
          fi
          if [ "${SRAM_USED}" -gt "${SRAM_LIMIT}" ]; then
            echo "ERROR: SRAM budget exceeded" && exit 1
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          # run_id guarantees uniqueness across manual re-runs of the same SHA
          name: star-stm32-firmware-${{ matrix.chip }}-${{ github.run_id }}-${{ github.sha }}
          path: |
            star-stm32-firmware/${{ matrix.build_dir }}/*.elf
            star-stm32-firmware/${{ matrix.build_dir }}/*.bin
            star-stm32-firmware/${{ matrix.build_dir }}/*.hex
            star-stm32-firmware/${{ matrix.build_dir }}/*.map
          retention-days: 30
