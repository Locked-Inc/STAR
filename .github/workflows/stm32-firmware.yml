name: STM32F767 Firmware Build Verify

# Cross-compile the STM32F767 firmware with arm-none-eabi-gcc and enforce
# binary size budgets.  Runs in the minimal STM32 Docker image published to
# GHCR by stm32-toolchain-image.yml.
#
# Prerequisite: the ghcr.io/locked-inc/star/stm32:10.3-2021.07 image must
# exist in GHCR before this workflow can pass.  Trigger
# stm32-toolchain-image.yml manually via workflow_dispatch the first time, or
# push a change to docker/stm32/Dockerfile.

on:
  push:
    branches: [main, 'adding-stm32-cicd', 'feature/**']
    paths:
      - 'star-stm32f767-firmware/**'
      - '.github/workflows/stm32-firmware.yml'
      - 'docker/stm32/Dockerfile'
  pull_request:
    paths:
      - 'star-stm32f767-firmware/**'
      - '.github/workflows/stm32-firmware.yml'
      - 'docker/stm32/Dockerfile'

# Cancel stale builds on fast-push branches -- only the latest commit matters.
# NOT applied to stm32-toolchain-image.yml to avoid corrupted partial pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Cross-Compile with arm-none-eabi-gcc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read     # required to pull ghcr.io image

    container:
      # Pin to versioned tag so toolchain upgrades are explicit in git history.
      # Update to :12.x when upgrading past Ubuntu 22.04 toolchain.
      # Never pin to :latest -- a silent toolchain bump could change code gen
      # and break builds without any git-visible change on this repo.
      image: ghcr.io/locked-inc/star/stm32:10.3-2021.07
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Configure firmware (Release)
        working-directory: star-stm32f767-firmware
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cubeide-gcc.cmake \
            -G Ninja

      - name: Build firmware
        working-directory: star-stm32f767-firmware
        run: cmake --build build -j$(nproc)

      - name: Report and enforce binary size budgets
        working-directory: star-stm32f767-firmware/build
        run: |
          arm-none-eabi-size --format=berkeley star-stm32f767-firmware.elf
          # --format=berkeley output: NR==1 is the header, NR==2 is the data row.
          # Fields: text  data  bss  dec  hex  filename
          TEXT=$(arm-none-eabi-size --format=berkeley star-stm32f767-firmware.elf | awk 'NR==2{print $1}')
          DATA=$(arm-none-eabi-size --format=berkeley star-stm32f767-firmware.elf | awk 'NR==2{print $2}')
          BSS=$(arm-none-eabi-size  --format=berkeley star-stm32f767-firmware.elf | awk 'NR==2{print $3}')
          # STM32F767ZI hardware limits
          FLASH_LIMIT=2097152   # 2 MB Flash
          SRAM_LIMIT=524288     # 512 KB SRAM1
          #   Flash usage = text + data  (data initializers copied from Flash at boot)
          #   SRAM usage  = data + bss   (data initialized + zero-init)
          FLASH_USED=$((TEXT + DATA))
          SRAM_USED=$((DATA + BSS))
          echo "Flash: ${FLASH_USED} / ${FLASH_LIMIT} bytes ($((FLASH_USED * 100 / FLASH_LIMIT))%)"
          echo "SRAM:  ${SRAM_USED}  / ${SRAM_LIMIT}  bytes ($((SRAM_USED  * 100 / SRAM_LIMIT))%)"
          if [ "${FLASH_USED}" -gt "${FLASH_LIMIT}" ]; then
            echo "ERROR: Flash budget exceeded (2 MB limit)" && exit 1
          fi
          if [ "${SRAM_USED}" -gt "${SRAM_LIMIT}" ]; then
            echo "ERROR: SRAM budget exceeded (512 KB limit)" && exit 1
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          # run_id guarantees uniqueness across manual re-runs of the same SHA
          name: star-stm32f767-firmware-${{ github.run_id }}-${{ github.sha }}
          path: |
            star-stm32f767-firmware/build/*.elf
            star-stm32f767-firmware/build/*.bin
            star-stm32f767-firmware/build/*.hex
            star-stm32f767-firmware/build/*.map
          retention-days: 30
