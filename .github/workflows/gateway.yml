# gateway.yml - Gateway Service CI/CD Pipeline for STAR Robot Project
# Tests the Go gateway service with build, test, lint, security, and cross-compilation.
#
# STAR Project - Texas A&M University
# January 2026

name: Gateway CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'star-gateway/**'
      - 'star-proto/**'
      - '.github/workflows/gateway.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'star-gateway/**'
      - 'star-proto/**'
      - '.github/workflows/gateway.yml'

# Cancel in-progress runs for the same PR/branch to avoid double-booking runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.2'
  GOLANGCI_LINT_VERSION: 'v2.11'  # golangci-lint v2 (required for action v8)
  MIN_COVERAGE: 65
  GOWORK: off  # Disable go.work in CI, use go.mod replace directive

jobs:
  # ============================================
  # Job 0: Generate protobuf Go code ONCE, share via artifact
  # Every downstream job pulls the artifact instead of re-running buf.
  # ============================================
  generate-proto:
    name: Generate Proto (shared)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: star-gateway/go.sum

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate protobuf Go code
        working-directory: star-proto
        run: |
          mkdir -p gen/go
          buf generate proto/ --template buf.gen.web.yaml --include-imports
          cd gen/go
          go mod init github.com/Locked-Inc/star-proto/gen/go || true
          go mod tidy

      - name: Upload generated Go code
        uses: actions/upload-artifact@v4
        with:
          name: star-proto-gen-go
          path: star-proto/gen/go/
          retention-days: 1

  # ============================================
  # Job 1: Build and Test (Primary)
  # ============================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: generate-proto
    defaults:
      run:
        working-directory: star-gateway
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: star-gateway/go.sum

      - name: Download generated proto
        uses: actions/download-artifact@v4
        with:
          name: star-proto-gen-go
          path: star-proto/gen/go/

      - name: Tidy dependencies (includes transitive deps from replaced modules)
        run: go mod tidy

      - name: Verify dependencies
        run: go mod verify

      - name: Build gateway binary
        run: go build -v -o star-gateway ./cmd/star-gateway

      # CDC Transport Testing Strategy:
      # - Mock tests run in CI/CD without hardware (using cdc_mock_test.go)
      # - Hardware tests skip gracefully when /dev/ttyACM0 is unavailable
      # - Mock tests verify: partial I/O, stalls, timeouts, errors, concurrency
      # - See: star-gateway/internal/transport/cdc_test.go
      - name: Run CDC transport mock tests (hardware-independent)
        run: |
          echo "### USB CDC Transport Tests (Mock-Based)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Running hardware-independent CDC transport tests using mock serial port..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          go test -v -run TestCDCTransportMock ./internal/transport 2>&1 | tee cdc-test.log

          # Extract test results
          passed=$(grep -c "PASS: TestCDCTransportMock" cdc-test.log || echo "0")
          echo "[PASS] **CDC Mock Tests Passed:** $passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>CDC Test Coverage</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Partial write handling (single byte, multi-byte)" >> $GITHUB_STEP_SUMMARY
          echo "- Partial read handling (incremental reads)" >> $GITHUB_STEP_SUMMARY
          echo "- Write stall detection (zero-progress loops)" >> $GITHUB_STEP_SUMMARY
          echo "- Read timeout detection" >> $GITHUB_STEP_SUMMARY
          echo "- Device disconnect simulation" >> $GITHUB_STEP_SUMMARY
          echo "- Concurrent access safety" >> $GITHUB_STEP_SUMMARY
          echo "- Loopback transfers" >> $GITHUB_STEP_SUMMARY
          echo "- Context timeout restoration" >> $GITHUB_STEP_SUMMARY
          echo "- Deadline handling" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Run unit tests (full suite)
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Calculate coverage
        id: coverage
        run: |
          total=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "total=$total" >> $GITHUB_OUTPUT
          echo "### Test Coverage: ${total}%" >> $GITHUB_STEP_SUMMARY

      - name: Check coverage threshold
        run: |
          coverage=${{ steps.coverage.outputs.total }}
          echo "Coverage: ${coverage}%"
          echo "Threshold: ${{ env.MIN_COVERAGE }}%"
          if (( $(echo "$coverage < ${{ env.MIN_COVERAGE }}" | bc -l) )); then
            echo "[FAIL] Coverage ${coverage}% is below threshold ${{ env.MIN_COVERAGE }}%"
            exit 1
          else
            echo "[PASS] Coverage ${coverage}% meets threshold ${{ env.MIN_COVERAGE }}%"
          fi

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: star-gateway/coverage.html
          retention-days: 30

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-gateway-linux-amd64-test
          path: star-gateway/star-gateway
          retention-days: 7

  # ============================================
  # Job 2: Linting and Code Quality
  # ============================================
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    needs: generate-proto
    defaults:
      run:
        working-directory: star-gateway
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: star-gateway/go.sum

      - name: Download generated proto
        uses: actions/download-artifact@v4
        with:
          name: star-proto-gen-go
          path: star-proto/gen/go/

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || {
            echo "[FAIL] go.mod or go.sum is not tidy. Run 'go mod tidy' and commit changes."
            exit 1
          }

      - name: Run go vet
        run: go vet ./...

      - name: Check for BigEndian usage (regression guard)
        run: |
          cd star-gateway
          # Search production code (exclude tests and vendor)
          if grep -r "binary\.BigEndian" \
             --include="*.go" \
             --exclude="*_test.go" \
             --exclude-dir="vendor" \
             .; then
            echo "[FAIL] ERROR: Found binary.BigEndian in production code!"
            echo "All multi-byte fields must use binary.LittleEndian after endianness migration."
            echo "See /workspaces/STAR/CLAUDE.md for protocol specification."
            exit 1
          fi
          echo "[PASS] No BigEndian usage detected (expected after migration)"
        working-directory: .

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "[FAIL] The following files are not formatted:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' to fix formatting issues."
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: star-gateway
          args: --timeout=5m

  # ============================================
  # Job 3: Security Scanning
  # ============================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: generate-proto
    defaults:
      run:
        working-directory: star-gateway
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: star-gateway/go.sum

      - name: Download generated proto
        uses: actions/download-artifact@v4
        with:
          name: star-proto-gen-go
          path: star-proto/gen/go/

      - name: Cache govulncheck binary
        uses: actions/cache@v4
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-${{ runner.os }}-${{ env.GO_VERSION }}

      - name: Install govulncheck
        run: |
          if [ ! -x "$HOME/go/bin/govulncheck" ]; then
            go install golang.org/x/vuln/cmd/govulncheck@latest
          fi

      - name: Run govulncheck
        run: $(go env GOPATH)/bin/govulncheck ./...

      - name: Run go list to check dependencies
        run: |
          echo "### Direct Dependencies" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go list -m all | grep -v "^github.com/Locked-Inc/STAR/star-gateway" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Job 4: Cross-Compilation for RPi5 (ARM64)
  # ============================================
  cross-compile:
    name: Cross-Compile for RPi5
    runs-on: ubuntu-latest
    needs: generate-proto
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
            name: raspberry-pi-5
          - goos: linux
            goarch: amd64
            name: linux-x86-64
    defaults:
      run:
        working-directory: star-gateway
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: star-gateway/go.sum

      - name: Download generated proto
        uses: actions/download-artifact@v4
        with:
          name: star-proto-gen-go
          path: star-proto/gen/go/

      - name: Tidy dependencies (includes transitive deps from replaced modules)
        run: go mod tidy

      - name: Build for ${{ matrix.name }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            # Install ARM64 cross-compilation tools
            sudo apt-get update
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            export CC=aarch64-linux-gnu-gcc
            export CXX=aarch64-linux-gnu-g++
          fi

          go build -v \
            -ldflags="-s -w" \
            -o star-gateway-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/star-gateway

      - name: Check binary size
        run: |
          size=$(du -h star-gateway-${{ matrix.goos }}-${{ matrix.goarch }} | cut -f1)
          echo "Binary size for ${{ matrix.name }}: $size"
          echo "### Binary Size (${{ matrix.name }}): $size" >> $GITHUB_STEP_SUMMARY

      - name: Verify binary
        if: matrix.goarch == 'amd64'
        run: |
          file star-gateway-${{ matrix.goos }}-${{ matrix.goarch }}
          ./star-gateway-${{ matrix.goos }}-${{ matrix.goarch }} --version || true

      - name: Upload cross-compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: star-gateway-${{ matrix.goos }}-${{ matrix.goarch }}
          path: star-gateway/star-gateway-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7

  # ============================================
  # Job 5: Integration Tests (Optional)
  # ============================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [generate-proto, build-and-test]
    defaults:
      run:
        working-directory: star-gateway
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: star-gateway/go.sum

      - name: Download generated proto
        uses: actions/download-artifact@v4
        with:
          name: star-proto-gen-go
          path: star-proto/gen/go/

      - name: Tidy dependencies (includes transitive deps from replaced modules)
        run: go mod tidy

      - name: Run integration tests
        run: |
          # Run tests tagged with 'integration' if they exist
          go test -v -tags=integration ./... || echo "No integration tests found"

  # ============================================
  # Job 6: Benchmark Tests
  # ============================================
  benchmark:
    name: Benchmark Tests
    runs-on: ubuntu-latest
    needs: generate-proto
    # Only run benchmarks on pushes to main/develop -- skip on PRs to save ~2-3 min
    # on every PR run.  Benchmark results on PRs are noisy on shared runners anyway.
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: star-gateway
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: star-gateway/go.sum

      - name: Download generated proto
        uses: actions/download-artifact@v4
        with:
          name: star-proto-gen-go
          path: star-proto/gen/go/

      - name: Tidy dependencies (includes transitive deps from replaced modules)
        run: go mod tidy

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -run=^$ ./... > benchmark.txt 2>&1 || true
          if [ -s benchmark.txt ]; then
            echo "### Benchmark Results" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat benchmark.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: star-gateway/benchmark.txt
          retention-days: 30

  # ============================================
  # Job 7: CI Summary
  # ============================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, security, cross-compile]
    if: always()
    steps:
      - name: Check Job Results
        run: |
          echo "## Gateway CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Build & Test** | ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Linting** | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Security Scan** | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cross-Compile** | ${{ needs.cross-compile.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-and-test.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.cross-compile.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[FAIL] **CI Failed** - Please check the logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[PASS] **All Checks Passed**" >> $GITHUB_STEP_SUMMARY
          fi
