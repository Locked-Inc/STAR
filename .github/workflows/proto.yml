# proto.yml - Protobuf CI/CD Pipeline for STAR Robot Project
# Lints, validates, and tests protobuf definitions following Boston Dynamics style.
#
# STAR Project - Texas A&M University
# December 2025

name: Protobuf CI

on:
  push:
    branches: [main, develop, protobuf-integration]
    paths:
      - 'star-proto/**'
      - '.github/workflows/proto.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'star-proto/**'
      - '.github/workflows/proto.yml'

# Cancel in-progress runs for the same PR/branch; rapid pushes shouldn't double-book runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUF_VERSION: '1.28.1'
  NODE_VERSION: '20'
  GO_VERSION: '1.25.x'

jobs:
  # ============================================
  # Job 1: Lint and Validate Proto Files
  # ============================================
  lint:
    name: Lint Protobuf Files
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: star-proto
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Buf Format Check
        run: buf format --diff --exit-code proto/

      - name: Buf Lint
        run: buf lint proto/

      - name: Buf Build (validate compilation)
        run: buf build proto/

  # ============================================
  # Job 2: Breaking Change Detection
  # ============================================
  breaking:
    name: Breaking Change Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: star-proto
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if protos exist in main
        id: check-main
        run: |
          if git ls-tree -r origin/main --name-only | grep -q '^star-proto/proto/'; then
            echo "has_protos=true" >> $GITHUB_OUTPUT
          else
            echo "has_protos=false" >> $GITHUB_OUTPUT
            echo "Skipping breaking change detection - no protos in main yet"
          fi

      - name: Buf Breaking Change Detection
        if: steps.check-main.outputs.has_protos == 'true'
        run: buf breaking proto/ --against '.git#branch=main,subdir=star-proto/proto'

  # ============================================
  # Job 3: Generate Go Code (Primary)
  # ============================================
  generate-go:
    name: Generate Go Code
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: star-proto
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: star-proto/tests/go/go.sum

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Go Code
        run: |
          mkdir -p gen/go
          buf generate proto/ --template buf.gen.web.yaml --include-imports

      - name: Create go.mod for generated code
        run: |
          cd gen/go
          go mod init github.com/Locked-Inc/star-proto/gen/go
          go mod tidy

      - name: Upload Go Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-generated
          path: star-proto/gen/go/
          retention-days: 7

  # ============================================
  # Job 4: Generate TypeScript Code
  # ============================================
  generate-typescript:
    name: Generate TypeScript Code
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: star-proto
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: star-proto/tests/typescript/package-lock.json

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate TypeScript Code
        run: |
          mkdir -p gen/typescript
          buf generate proto/ --template buf.gen.web.yaml --include-imports

      - name: Upload TypeScript Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typescript-generated
          path: star-proto/gen/typescript/
          retention-days: 7

  # ============================================
  # Job 5: Generate nanopb C Code
  # ============================================
  generate-nanopb:
    name: Generate nanopb C Code
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: star-proto
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install nanopb
        run: pip install nanopb protobuf grpcio-tools

      - name: Generate nanopb Code
        run: |
          mkdir -p gen/nanopb
          for proto in proto/star/v1/*.proto; do
            nanopb_generator \
              --proto-path=proto \
              --options-path=nanopb \
              --output-dir=gen/nanopb \
              "$proto" || echo "Warning: Failed to generate $proto"
          done

      - name: Upload nanopb Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nanopb-generated
          path: star-proto/gen/nanopb/
          retention-days: 7
          if-no-files-found: warn

  # ============================================
  # Job 6: Test Go Serialization (Primary)
  # ============================================
  test-go:
    name: Test Go Serialization
    runs-on: ubuntu-latest
    needs: generate-go
    defaults:
      run:
        working-directory: star-proto/tests/go
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: star-proto/tests/go/go.sum

      - name: Download Go Artifacts
        uses: actions/download-artifact@v4
        with:
          name: go-generated
          path: star-proto/gen/go/

      - name: Download Dependencies
        run: go mod tidy

      - name: Run Go Tests
        run: go test -v ./...

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-test-results
          path: star-proto/tests/go/

  # ============================================
  # Job 7: Test TypeScript Serialization
  # ============================================
  test-typescript:
    name: Test TypeScript Serialization
    runs-on: ubuntu-latest
    needs: generate-typescript
    defaults:
      run:
        working-directory: star-proto/tests/typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: star-proto/tests/typescript/package-lock.json

      - name: Download TypeScript Artifacts
        uses: actions/download-artifact@v4
        with:
          name: typescript-generated
          path: star-proto/gen/typescript/

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run TypeScript Tests
        run: npm test

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typescript-test-results
          path: star-proto/tests/typescript/coverage/

  # ============================================
  # Job 8: Test nanopb C Serialization
  # ============================================
  test-nanopb:
    name: Test nanopb C Serialization
    runs-on: ubuntu-latest
    needs: generate-nanopb
    defaults:
      run:
        working-directory: star-proto/tests/nanopb
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download nanopb Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nanopb-generated
          path: star-proto/gen/nanopb/

      # ubuntu-latest runners ship with cmake and gcc already; skip the
      # 30-60s apt-get update + install.  Re-add only if the base image drops them.
      - name: Verify Build Dependencies
        run: |
          command -v cmake >/dev/null && command -v gcc >/dev/null \
            || { echo "cmake/gcc missing; restore apt-get install"; exit 1; }

      - name: Build and Run Tests
        run: |
          mkdir -p build && cd build
          cmake ..
          make
          ctest --output-on-failure

  # ============================================
  # Job 9: Verify nanopb LidarScan bounds are in sync
  # ============================================
  nanopb-sync:
    name: Verify nanopb LidarScan bounds sync
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: star-proto
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Verify LidarScan max_count values are identical across options files
        run: |
          bash scripts/check_nanopb_sync.sh

  # ============================================
  # Job 10: Summary Report
  # ============================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, generate-go, generate-typescript, generate-nanopb, test-go, test-typescript, test-nanopb, nanopb-sync]
    if: always()
    steps:
      - name: Check Job Results
        run: |
          echo "## Protobuf CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Generate Go** | ${{ needs.generate-go.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Generate TypeScript | ${{ needs.generate-typescript.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Generate nanopb | ${{ needs.generate-nanopb.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Test Go (Primary)** | ${{ needs.test-go.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test TypeScript | ${{ needs.test-typescript.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test nanopb | ${{ needs.test-nanopb.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| nanopb Sync | ${{ needs.nanopb-sync.result }} |" >> $GITHUB_STEP_SUMMARY
