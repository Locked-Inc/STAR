name: Build STM32 Toolchain Image

# Runs infrequently -- only when the Dockerfile changes.
# Manual workflow_dispatch is included so the initial image can be populated
# before the first automatic trigger lands on main.
#
# NOTE: concurrency is intentionally ABSENT from this workflow.
# stm32-firmware.yml uses a concurrency group to cancel stale runs on fast-push
# branches.  This workflow is excluded because a partial or cancelled Docker
# push leaves GHCR in an inconsistent state: the image manifest may be written
# but layers incomplete, causing downstream pulls in stm32-firmware.yml to fail
# with cryptic layer errors.
#
# BOOTSTRAP: Push this file to adding-stm32-cicd and trigger workflow_dispatch
# once to populate ghcr.io/locked-inc/star/stm32:10.3-2021.07 before the
# build workflow can pass.  Unlike docker/gnurx/, no LFS files are needed --
# arm-none-eabi-gcc is installed via apt-get, so the build is fast (~2 min).

on:
  push:
    branches: [main, 'adding-stm32-cicd']
    paths:
      - 'docker/stm32/Dockerfile'
      - '.github/workflows/stm32-toolchain-image.yml'
  pull_request:
    paths:
      - 'docker/stm32/Dockerfile'
      - '.github/workflows/stm32-toolchain-image.yml'
  workflow_dispatch:     # manual trigger for initial image population

jobs:
  build-push:
    name: Build and Push STM32 Image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write    # required to push to ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push STM32 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          # Context is just docker/stm32/ -- no LFS files need to be COPYed
          # from the repo root (unlike docker/gnurx/ which requires the full
          # repo root context for the LFS-tracked .run installer).
          context: docker/stm32
          file: docker/stm32/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          # Both tags are pushed:
          #   :latest            -- convenience; stm32-firmware.yml pins to versioned
          #   :10.3-2021.07      -- explicit version matching Ubuntu 22.04 package
          # Update the versioned tag when the toolchain is upgraded.
          tags: |
            ghcr.io/locked-inc/star/stm32:latest
            ghcr.io/locked-inc/star/stm32:10.3-2021.07
          cache-from: type=gha
          cache-to: type=gha,mode=max
