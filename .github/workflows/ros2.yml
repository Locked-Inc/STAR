name: ROS2 Build and Test

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'star-ros2/**'
      - 'star-proto/**'
      - '.github/workflows/ros2.yml'
      - 'Dockerfile'
      - '.devcontainer/**'
      - 'scripts/ros2/**'
  pull_request:
    paths:
      - 'star-ros2/**'
      - 'star-proto/**'
      - '.github/workflows/ros2.yml'
      - 'Dockerfile'
      - '.devcontainer/**'
      - 'scripts/ros2/**'

# Cancel in-progress runs for the same PR/branch to avoid double-booking runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build ROS2 Packages
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        # osrf/ros:jazzy-desktop already has apt lists populated on image build;
        # only run apt-get update if lists are older than 1 day to avoid waste.
        run: |
          if [ -z "$(find /var/lib/apt/lists -maxdepth 1 -mmin -1440 2>/dev/null | head -n1)" ]; then
            apt-get update
          fi
          apt-get install -y --no-install-recommends \
            python3-pip \
            python3-colcon-common-extensions \
            libprotobuf-dev \
            protobuf-compiler \
            protobuf-compiler-grpc \
            libgrpc++-dev \
            libgrpc-dev \
            ccache

      - name: Cache rosdep + colcon ccache
        uses: actions/cache@v4
        with:
          path: |
            /root/.ccache
            /root/.ros/rosdep
          key: ros2-${{ runner.os }}-${{ hashFiles('star-ros2/**/package.xml') }}
          restore-keys: |
            ros2-${{ runner.os }}-

      - name: Initialize rosdep
        run: |
          rosdep update --rosdistro jazzy

      - name: Install ROS dependencies
        run: |
          cd star-ros2
          rosdep install --from-paths src --ignore-src -r -y --rosdistro jazzy

      - name: Cache buf binary
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/buf
          key: buf-1.28.1-${{ runner.os }}

      - name: Install buf
        run: |
          if [ ! -x /usr/local/bin/buf ]; then
            BUF_VERSION=1.28.1
            curl -sSL \
              "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-$(uname -s)-$(uname -m)" \
              -o "/usr/local/bin/buf"
            chmod +x /usr/local/bin/buf
          fi

      - name: Generate Protobuf C++ code
        run: |
          cd star-proto

          # Copy proto files to temp directory to avoid buf.yaml BSR configuration
          mkdir -p /tmp/star-proto
          cp -r proto/star /tmp/star-proto/

          # Create minimal buf.yaml in temp directory (no BSR name)
          cat > /tmp/star-proto/buf.yaml <<EOF
          version: v1
          lint:
            use: [DEFAULT]
          EOF

          # Create buf.gen.yaml for C++ only
          # Pin to Ubuntu 24.04 versions: protobuf 3.21.12, grpc 1.51.1
          cat > /tmp/buf.gen.ros2.yaml <<EOF
          version: v1
          plugins:
            - plugin: buf.build/protocolbuffers/cpp:v21.12
              out: $PWD/gen/cpp
            - plugin: buf.build/grpc/cpp:v1.51.1
              out: $PWD/gen/cpp
          EOF

          # Generate C++ code from temp directory (no BSR pollution)
          buf generate /tmp/star-proto --template /tmp/buf.gen.ros2.yaml

      - name: Build packages (with ccache + warnings as errors)
        # Combines the previous "Build packages" and "Check for compiler warnings"
        # steps.  Running two full colcon builds ~doubled ROS2 CI time; a single
        # build with -Wall -Wextra -Werror enforces the same contract.  ccache
        # caches object files across runs for ~30-50% faster recompiles on hits.
        shell: bash
        run: |
          cd star-ros2
          source /opt/ros/jazzy/setup.bash
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR=/root/.ccache
          ccache --max-size=2G
          colcon build \
            --symlink-install \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DBUILD_TESTING=ON
          ccache --show-stats || true

      - name: Run tests
        shell: bash
        run: |
          cd star-ros2
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test \
            --return-code-on-test-failure \
            --event-handlers console_direct+

      - name: Display test results
        if: always()
        run: |
          cd star-ros2
          colcon test-result --verbose

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: star-ros2/log/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            star-ros2/build/**/test_results/
            star-ros2/build/**/Testing/
          retention-days: 7

  format-check:
    name: C++ Formatting Check
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check C++ formatting with uncrustify
        shell: bash
        run: |
          # Source ROS2 environment (required for ament tools)
          source /opt/ros/jazzy/setup.bash
          
          # Use the centralized script to check all packages
          ./scripts/ros2/format-ros2.sh --check

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install linting tools
        # Avoid apt-get update if image's apt lists are <24h old (container reuse).
        run: |
          if [ -z "$(find /var/lib/apt/lists -maxdepth 1 -mmin -1440 2>/dev/null | head -n1)" ]; then
            apt-get update
          fi
          apt-get install -y --no-install-recommends \
            ros-jazzy-ament-copyright \
            ros-jazzy-ament-cppcheck \
            ros-jazzy-ament-cpplint \
            ros-jazzy-ament-flake8 \
            ros-jazzy-ament-lint-cmake

      - name: Run ament_copyright
        run: |
          cd star-ros2/src
          ament_copyright . || true

      - name: Run ament_cppcheck
        run: |
          cd star-ros2/src
          ament_cppcheck . || true

      - name: Run ament_cpplint
        run: |
          cd star-ros2/src
          ament_cpplint . || true

      - name: Run ament_lint_cmake
        run: |
          cd star-ros2/src
          ament_lint_cmake . || true

  code-review:
    name: Automated Code Review
    runs-on: ubuntu-latest
    # NOTE: Non-blocking during infrastructure phase
    # Will become blocking in future PRs when application code is added
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run code review
        run: |
          ./scripts/ros2/review-ros2.sh --report review.txt || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-review-report
          path: review.txt
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('review.txt')) {
              console.log('No review.txt found, skipping PR comment');
              return;
            }
            const report = fs.readFileSync('review.txt', 'utf8');
            const maxLength = 60000;
            const truncated = report.length > maxLength
              ? report.substring(0, maxLength) + '\n\n[Report truncated...]'
              : report;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('[BOT] Automated Code Review')
            );

            const body = '## [BOT] Automated Code Review\n\n```\n' + truncated + '\n```';

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
