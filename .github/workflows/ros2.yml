name: ROS2 Build and Test

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'star-ros2/**'
      - '.github/workflows/ros2.yml'
      - 'Dockerfile'
      - '.devcontainer/**'
  pull_request:
    paths:
      - 'star-ros2/**'
      - '.github/workflows/ros2.yml'
      - 'Dockerfile'
      - '.devcontainer/**'

jobs:
  build-and-test:
    name: Build ROS2 Packages
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pip \
            python3-colcon-common-extensions

      - name: Initialize rosdep
        run: |
          rosdep update --rosdistro jazzy

      - name: Install ROS dependencies
        run: |
          cd star-ros2
          rosdep install --from-paths src --ignore-src -r -y --rosdistro jazzy

      - name: Build packages
        shell: bash
        run: |
          cd star-ros2
          source /opt/ros/jazzy/setup.bash
          colcon build \
            --symlink-install \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run tests
        shell: bash
        run: |
          cd star-ros2
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test \
            --return-code-on-test-failure \
            --event-handlers console_direct+

      - name: Display test results
        if: always()
        run: |
          cd star-ros2
          colcon test-result --verbose

      - name: Check for compiler warnings
        shell: bash
        run: |
          cd star-ros2
          source /opt/ros/jazzy/setup.bash
          colcon build --cmake-clean-cache \
            --cmake-args \
              -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror" \
              -DCMAKE_BUILD_TYPE=Release

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: star-ros2/log/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            star-ros2/build/**/test_results/
            star-ros2/build/**/Testing/
          retention-days: 7

  format-check:
    name: C++ Formatting Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check C++ formatting
        working-directory: star-ros2
        run: |
          # Find all C++ files
          FILES=$(find src -name '*.cpp' -o -name '*.hpp' 2>/dev/null || true)

          if [ -z "$FILES" ]; then
            echo "No C++ files found to format"
            exit 0
          fi

          # Check formatting (fail if any file needs formatting)
          echo "$FILES" | xargs clang-format --dry-run --Werror

          if [ $? -ne 0 ]; then
            echo ""
            echo "❌ Formatting check failed!"
            echo "Run this to fix formatting:"
            echo "  cd star-ros2 && find src -name '*.cpp' -o -name '*.hpp' | xargs clang-format -i"
            exit 1
          fi

          echo "✅ All C++ files are properly formatted"

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install linting tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-jazzy-ament-copyright \
            ros-jazzy-ament-cppcheck \
            ros-jazzy-ament-cpplint \
            ros-jazzy-ament-flake8 \
            ros-jazzy-ament-lint-cmake

      - name: Run ament_copyright
        run: |
          cd star-ros2/src
          ament_copyright . || true

      - name: Run ament_cppcheck
        run: |
          cd star-ros2/src
          ament_cppcheck . || true

      - name: Run ament_cpplint
        run: |
          cd star-ros2/src
          ament_cpplint . || true

      - name: Run ament_lint_cmake
        run: |
          cd star-ros2/src
          ament_lint_cmake . || true
