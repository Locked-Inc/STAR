# ascii-check.yml - ASCII-only source file enforcement for STAR project
#
# Rejects any commit that introduces non-ASCII characters into source files.
# Covers ALL text source files tracked by git, excluding binary files.
#
# STAR Project - Texas A&M University

name: ASCII Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ascii-check:
    name: ASCII-only source files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for non-ASCII characters
        run: |
          echo "Scanning source files for non-ASCII characters..."

          # All text source file extensions and specific filenames to check.
          # Excludes binary formats (images, PDFs, compiled objects, archives).
          # Include text source file patterns, exclude vendor/binary/build paths.
          # Uses :(exclude) pathspec (not :!) for reliable directory exclusion.
          mapfile -t files < <(git ls-files -- \
            '*.c' '*.h' '*.go' '*.cpp' '*.hpp' '*.proto' '*.ts' '*.md' \
            '*.yml' '*.yaml' '*.sh' '*.py' '*.cmake' '*.json' '*.toml' \
            '*.cfg' '*.conf' '*.tex' '*.bib' '*.css' '*.html' '*.xml' \
            '*.txt' '*.ini' '*.rs' '*.java' '*.rb' '*.lua' '*.js' \
            'Makefile' '*Makefile' 'Dockerfile' '*Dockerfile*' \
            '.clang-format' '.clang-tidy' '.cppcheck-suppressions' \
            ':(exclude)build/**' \
            ':(exclude)**/build/**' \
            ':(exclude)**/_deps/**' \
            ':(exclude)node_modules/**' \
            ':(exclude)dist/**' \
            ':(exclude)**/gen/**' \
            ':(exclude)vendor/**' \
            ':(exclude)**/third_party/**' \
            ':(exclude)schematic/symbols-and-footprints/**' \
            ':(exclude)star-rx72n-firmware/LICENSE.txt' \
            ':(exclude)star-rx72n-firmware/LICENSED-HARDWARE.txt' \
            ':(exclude)star-rx72n-firmware/usb_test/bulk_in_fix.c')

          failed=0
          for f in "${files[@]}"; do
            if grep -qP "[^\x00-\x7F]" "$f" 2>/dev/null; then
              echo "::error file=$f::Non-ASCII characters found"
              echo ""
              echo "  $f"
              grep -nP "[^\x00-\x7F]" "$f" | head -10 | while IFS= read -r line; do
                echo "    $line"
              done
              failed=1
            fi
          done

          if [[ $failed -ne 0 ]]; then
            echo ""
            echo "STAR policy: all source files must be pure 7-bit ASCII."
            echo "Fix with: python3 scripts/utils/fix-encoding.py <file>"
            echo "See CLAUDE.md 'Character Encoding Policy' for the replacement table."
            exit 1
          fi

          echo "[OK] All ${#files[@]} source files are ASCII-clean."
