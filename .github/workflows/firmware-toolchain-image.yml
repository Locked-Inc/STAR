name: Build GNURX Toolchain Image

# Runs infrequently -- only when the minimal Dockerfile changes.
# Manual workflow_dispatch is included so the initial image can be populated
# before the first automatic trigger lands on main.
#
# NOTE: concurrency is intentionally ABSENT from this workflow.
# firmware-unit-tests.yml and firmware-build-verify.yml use concurrency groups
# to cancel stale runs on fast-push branches.  This workflow is excluded because
# a partial or cancelled Docker push leaves GHCR in an inconsistent state:
# the image manifest may be written but layers incomplete, causing downstream
# pulls in firmware-build-verify.yml to fail with cryptic layer errors.

on:
  push:
    branches: [main, 'adding-cicd-tests-for-rx72n']
    paths:
      - 'docker/gnurx/Dockerfile'
      - '.github/workflows/firmware-toolchain-image.yml'
  workflow_dispatch:     # manual trigger for initial image population

jobs:
  build-push:
    name: Build and Push GNURX Image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write    # required to push to ghcr.io

    steps:
      - name: Checkout repository (with LFS)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # lfs: true runs `git lfs fetch` to populate the local LFS object
          # store.  We additionally run `git lfs pull` below to force the smudge
          # filter so the working-tree file is the real binary, not the 134-byte
          # LFS pointer.  Docker's COPY uses the working-tree file.
          lfs: true

      - name: Verify LFS installer is materialised
        run: |
          # `git lfs fetch` (called by lfs:true above) fills the local object
          # store but may not update the working tree.  `git lfs pull` forces
          # the smudge filter so the installer is a real binary, not a pointer.
          git lfs pull --include="gcc-14.2.0.202511-GNURX-ELF.run"
          INSTALLER_SIZE=$(stat -c '%s' gcc-14.2.0.202511-GNURX-ELF.run)
          echo "Installer size: ${INSTALLER_SIZE} bytes"
          if [ "${INSTALLER_SIZE}" -lt 100000000 ]; then
            echo "ERROR: installer is ${INSTALLER_SIZE} bytes -- LFS pointer file, not binary."
            echo "Check LFS quota and ensure the file was committed with git lfs."
            exit 1
          fi
          echo "OK: installer binary size verified (${INSTALLER_SIZE} bytes)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GNURX image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          # path context (not git:// URL) -- sees LFS files from the checkout
          # step above.  A git:// URL context would bypass the runner filesystem
          # and attempt its own LFS fetch, which hits rate limits and fails.
          context: .
          file: docker/gnurx/Dockerfile
          push: true
          # Both tags are pushed:
          #   :latest  -- convenience; firmware-build-verify.yml pins to versioned
          #   :14.2.0  -- explicit version; update this tag when GNURX upgrades so
          #               toolchain changes appear in git history, not silently
          #               under a mutable :latest reference
          tags: |
            ghcr.io/locked-inc/star/gnurx:latest
            ghcr.io/locked-inc/star/gnurx:14.2.0
          # GHA layer cache temporarily disabled to force a clean build while
          # debugging the "installer runs but binary not found" failure.
          # Re-enable (remove no-cache, restore cache-from/cache-to) once the
          # toolchain image builds successfully.
          no-cache: true
          # NO build-args for installer URL -- COPY handles it via path context
