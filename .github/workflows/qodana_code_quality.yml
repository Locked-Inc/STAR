name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Prepare C++ Analysis
        run: |
          # Create a build directory
          mkdir -p build
          
          # Run CMake pointing to your specific subdirectory (-S)
          # We enable compile commands so Qodana can read them later
          cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -S star-rx72n-firmware -B build

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2025.2
        with:
          pr-mode: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_2021385077 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
