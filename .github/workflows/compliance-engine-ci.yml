name: compliance-engine-ci

on:
  push:
    branches:
      - main
      - 'docs/**'
      - 'feat/**'
    paths:
      - 'final_capstone/compliance-engine/**'
      - 'star-ros2/src/star_compliance_msgs/**'
      - '.github/workflows/compliance-engine-ci.yml'
  pull_request:
    paths:
      - 'final_capstone/compliance-engine/**'
      - 'star-ros2/src/star_compliance_msgs/**'
      - '.github/workflows/compliance-engine-ci.yml'

jobs:
  unit-tests:
    name: compliance-engine unit tests (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        working-directory: final_capstone/compliance-engine
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-image scikit-learn pytest reportlab

      - name: Run pytest
        working-directory: final_capstone/compliance-engine
        run: PYTHONPATH=. pytest -v --maxfail=1

      - name: ASCII check on compliance-engine sources
        run: |
          python3 scripts/utils/fix-encoding.py --check \
            final_capstone/compliance-engine/ \
            star-ros2/src/star_compliance_msgs/

  colcon-build:
    name: colcon build (star_compliance_msgs)
    runs-on: ubuntu-24.04
    container: osrf/ros:jazzy-desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions

      - name: Build star_compliance_msgs only
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd star-ros2
          colcon build --packages-select star_compliance_msgs --event-handlers console_direct+

      - name: Verify message generation
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source star-ros2/install/setup.bash
          ros2 interface list | grep -E 'star_compliance_msgs'
          ros2 interface show star_compliance_msgs/msg/DoorwayMeasurement | head -20
