# firmware-tests.yml - Lightweight firmware test pipeline
# Builds and runs RX72N unit tests with cmake + ctest.
# For full coverage, static analysis, and clang-tidy see firmware-unit-tests.yml.
#
# STAR Project - Texas A&M University
# April 2026

name: Firmware Tests

on:
  push:
    branches: [main, develop, 'feature/**']
    paths:
      - 'star-rx72n-firmware/**'
      - '.github/workflows/firmware-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'star-rx72n-firmware/**'
      - '.github/workflows/firmware-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build tests
        working-directory: star-rx72n-firmware
        run: cmake -B tests/build -S tests && cmake --build tests/build -j$(nproc)

      - name: Run tests
        working-directory: star-rx72n-firmware/tests/build
        run: ctest --output-on-failure
