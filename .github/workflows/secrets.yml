# secrets.yml - TruffleHog secret scanning for STAR project
#
# Scans for verified secrets on push (full repo) and PR (diff only).
# Uses --results=verified to report only confirmed-reachable credentials.
#
# STAR Project - Texas A&M University

name: Secret Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        id: trufflehog
        uses: trufflesecurity/trufflehog@ddc015e5ed99942b2253d8ea16a0586a01ef2ab1 # v3.88.0
        with:
          extra_args: --results=verified --fail --exclude-paths .trufflehog-exclude-paths.txt

      - name: Summary
        if: always()
        env:
          TRUFFLEHOG_OUTCOME: ${{ steps.trufflehog.outcome }}
        run: |
          echo "## Secret Scanning Results" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$TRUFFLEHOG_OUTCOME" == "success" ]]; then
            echo "[PASS] No verified secrets detected." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$TRUFFLEHOG_OUTCOME" == "failure" ]]; then
            echo "[FAIL] TruffleHog scan failed. This may indicate verified secrets or a scan error." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**If secrets were found:** Remove the secret, rotate the credential, and force-push to scrub history." >> "$GITHUB_STEP_SUMMARY"
            echo "**If scan error:** Check the job log for configuration issues." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "[WARN] TruffleHog step outcome: ${TRUFFLEHOG_OUTCOME}. See job log." >> "$GITHUB_STEP_SUMMARY"
          fi
