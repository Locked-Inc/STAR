name: Firmware HIL Integration Tests

# T3: Hardware-in-the-loop tests on a physical RX72N board.
#
# STATUS: PLACEHOLDER -- job is disabled with 'if: false'.
#         Remove 'if: false' when a self-hosted runner with an RX72N board is
#         provisioned and registered in GitHub repo Settings -> Actions -> Runners.
#
# Required hardware for the self-hosted runner:
#   - Raspberry Pi 4 (4 GB+) running Ubuntu 22.04
#   - Renesas E2 Lite debugger or Segger J-Link (USB)
#   - USB-UART adapter wired to RX72N UART for test output capture
#   - Renesas Flash Programmer CLI (rfp-cli) or OpenOCD with RX72N config
#
# Required software on the runner:
#   - GNURX toolchain installed at /opt/gnurx
#   - rfp-cli (or OpenOCD) on PATH
#   - Python 3.10+ with pytest and pyserial (pip install -r tests/hil/requirements.txt)
#
# Registration:
#   GitHub repo -> Settings -> Actions -> Runners -> New self-hosted runner
#   Label the runner 'rx72n-hil' and update runs-on below.

on:
  schedule:
    # Nightly at 03:00 UTC -- avoids peak GitHub Actions queue times
    - cron: '0 3 * * *'
  push:
    # Also run on release tags so every shipped firmware has HIL sign-off
    tags: ['v*']
  workflow_dispatch:     # manual trigger for on-demand HIL runs

jobs:
  hil-test:
    name: HIL Integration Tests on RX72N
    # DISABLED: remove 'if: false' when rx72n-hil runner is registered
    if: false  # yamllint disable-line rule:truthy
    runs-on: [self-hosted, rx72n-hil]
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Build firmware (Debug for HIL -- includes test instrumentation)
        working-directory: star-rx72n-firmware
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-rx72n.cmake \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j$(nproc)

      - name: Flash firmware to RX72N target
        run: |
          # TODO: implement scripts/flash.sh wrapping rfp-cli
          # Example invocation once implemented:
          #   rfp-cli -device rx72n -connect \
          #     -write star-rx72n-firmware/build/star-rx72n-firmware.mot \
          #     -verify \
          #     -reset
          echo "Placeholder: scripts/flash.sh not yet implemented"
          exit 1

      - name: Run HIL test suite
        working-directory: star-rx72n-firmware/tests/hil
        run: |
          # TODO: pytest-based serial/UART test harness
          #   pip install -r requirements.txt
          #   pytest -v --timeout=120 --serial-port=/dev/ttyUSB0
          echo "Placeholder: HIL test suite not yet implemented"
          exit 1

      - name: Upload HIL results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: hil-results-${{ github.run_id }}-${{ github.sha }}
          path: star-rx72n-firmware/tests/hil/results/
          retention-days: 30
