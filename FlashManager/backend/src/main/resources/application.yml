spring:
  application:
    name: flashmanager-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/flashmanager}
    username: ${DATABASE_USERNAME:flashmanager}
    password: ${DATABASE_PASSWORD:flashmanager123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  graphql:
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:true}
    websocket:
      path: /graphql
    path: /graphql

server:
  port: ${PORT:8081}
  servlet:
    context-path: /api/v1

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}  # 30 days

storage:
  binary-path: ${BINARY_STORAGE_PATH:/tmp/flashmanager-binaries}

flashmanager:
  build:
    artifacts-dir: ${BUILD_ARTIFACTS_DIR:/workspace/STAR/FlashManager/artifacts}
    esp32:
      repo-path: ${ESP32_REPO_PATH:/workspace/STAR/ESP32}
    pi5:
      repo-path: ${PI5_REPO_PATH:/workspace/STAR/Pi5}
    android:
      repo-path: ${ANDROID_REPO_PATH:/workspace/STAR/Android}
    backends:
      repo-path: ${BACKENDS_REPO_PATH:/workspace/STAR/Backends}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

logging:
  level:
    root: WARN
    com.star.flashmanager: ${LOG_LEVEL:INFO}
    org.springframework: WARN
    org.hibernate: WARN
