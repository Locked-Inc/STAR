spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

jwt:
  secret: test-secret-key-for-testing-purposes-only-must-be-256-bits-long-aaaaaaaaaaaaaaaaaaaaaaaaaaa
  expiration: 3600000
  refresh-expiration: 7200000

logging:
  level:
    root: ERROR
    com.star.flashmanager: DEBUG
