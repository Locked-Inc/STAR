    - path: "star-ros2/**/*.{cpp,hpp}"
      instructions: |
        Review ROS2 C++ code:

        Naming Conventions:
        - Classes/Types: CamelCase (e.g., StarGatewayBridgeNode)
        - Methods/Functions: snake_case (e.g., publish_telemetry, on_configure)
        - Member variables: trailing underscore (e.g., telemetry_pub_, timer_)
        - Constants: ALL_CAPITALS (e.g., MAX_RETRIES, DEFAULT_TIMEOUT_S)
        - Namespaces: star::package_name::

        File and Style:
        - Headers use .hpp extension (not .h)
        - Source files use .cpp extension
        - Line limit: 120 characters maximum
        - Include guards: Prefer #pragma once (consistent with C23 firmware), traditional guards acceptable for ROS2 compatibility
        - Traditional guard format (if used): PACKAGE_FILENAME_HPP_
        - Braces: Functions on new line, control statements cuddled
        - Indentation: 2 spaces (no tabs)
        - Filenames: under_scored (e.g., star_gateway_bridge_node.hpp)

        ROS2 Patterns:
        - Node inheritance: rclcpp::Node for basic nodes, rclcpp_lifecycle::LifecycleNode for safety-critical
        - Publishers/Subscribers: Use SharedPtr and std::bind for callbacks
        - Timers: Use create_wall_timer with std::chrono
        - Logging: RCLCPP_INFO/WARN/ERROR/DEBUG (NEVER printf/cout/std::cerr)
        - Throttled logging: RCLCPP_WARN_THROTTLE for high-frequency messages
        - Exception handling: Catch exceptions in callbacks to prevent node crashes

        Error Handling:
        - Throw exceptions for errors (different from C firmware)
        - Catch std::exception in all callbacks
        - Log errors with RCLCPP_ERROR including context

        Doxygen Documentation (CRITICAL - MAXIMUM COVERAGE REQUIRED):
        - ZERO TOLERANCE for undocumented code - ALL elements must have comprehensive Doxygen comments
        - See DOXYGEN_ROADMAP.md for complete reference and C++ specific examples
        - REJECT any PR with missing or incomplete documentation

        Documentation Requirements for C++:

        Classes/Nodes (MANDATORY tags):
        - @class/@brief/@details
        - Inheritance information (@extends, @implements)
        - Collaboration diagrams when applicable
        - Usage examples (@code)
        - @see references to related classes
        - @since version information

        Methods (MANDATORY tags):
        - @brief (one-line summary)
        - @details (implementation explanation)
        - @param[in/out/in,out] for ALL parameters
        - @return/@retval (all possible return values)
        - @throw/@exception (all exceptions that can be thrown)
        - @note (thread safety for ROS2 callbacks)
        - @code usage examples
        - @see cross-references

        Member Variables (MANDATORY):
        - /**< inline documentation for ALL members
        - Purpose, units, valid ranges
        - Thread safety notes for shared state

        State Machines (MANDATORY):
        - Lifecycle nodes MUST include @startuml state diagram
        - Document all lifecycle transitions (configure, activate, deactivate, cleanup)
        - Entry/exit actions documented

        ROS2 Specific Documentation:
        - Document QoS settings and rationale
        - Document callback execution context (thread, interrupt)
        - Document timer frequencies and justification
        - Document topic/service names and message types

        Enforcement:
        - All public methods must be documented
        - All lifecycle callbacks must include state transition info
        - All callbacks must document thread safety
        - Complex interactions must have sequence diagrams (@msc)

        Formatting:
        - Must pass clang-format check (star-ros2/.clang-format)
        - Run: find src -name '*.cpp' -o -name '*.hpp' | xargs clang-format -i
        - CI enforces formatting on all PRs

        Inclusive Terminology (CRITICAL - REJECT violations):
        - FORBIDDEN: master/slave, MOSI/MISO, blacklist/whitelist
        - REQUIRED: Controller/Peripheral, COPI/CIPO, denylist/allowlist

        Backward Compatibility (CRITICAL - REJECT violations):
        - ZERO backward compatibility requirements (in-house only, no releases)
        - Breaking changes are ENCOURAGED if they improve code quality
        - FORBIDDEN: Compatibility layers, deprecated fields marked with comments
        - REQUIRED: Delete unused message types and fields immediately
        - REQUIRED: Ensure all consumers updated when changing ROS2 message APIs

    - path: "star-ui/**/*.{ts,tsx}"
      instructions: |
        Review TypeScript/React UI code:

        Language and Framework Standards:
        - TypeScript strict mode; no implicit `any`
        - React 18 functional components and hooks only (no class components
          except ErrorBoundary, which requires class syntax)
        - Zustand for global state (useDashboardStore); no useState for
          shared data
        - Vite + Vitest for build and tests

        React Hook Rules:
        - useEffect cleanup must cancel async work (cancelled flag, abort
          controllers) to be safe under React StrictMode double-mount
        - WebSocket and other singleton resources must guard onclose/onerror
          with a cancelled flag before scheduling reconnects
        - No raw setTimeout/setInterval without cleanup in useEffect

        State Management:
        - All server-driven state lives in dashboardStore.ts via Zustand
        - Components read store slices via useShallow selectors to avoid
          unnecessary re-renders
        - Never mutate store state outside of store actions

        WebSocket / Binary Protocol:
        - ws.binaryType must be set to 'arraybuffer' before first message
        - Decode with STAREnvelope.fromBinary(new Uint8Array(raw))
        - Sequence gap detection and alert injection required

        Error Handling:
        - ErrorBoundary must wrap App in main.tsx
        - All Promise rejections and fetch errors must be caught and logged
        - WebSocket decode errors must be caught and counted; never crash the
          connection loop

        Testing:
        - Vitest for all unit tests
        - Test hooks in isolation with renderHook from @testing-library/react
        - Cover: normal path, error path, cleanup/cancellation

        Inclusive Terminology (CRITICAL - REJECT violations):
        - FORBIDDEN: master/slave, blacklist/whitelist
        - REQUIRED: Controller/Peripheral, denylist/allowlist

        Backward Compatibility (CRITICAL - REJECT violations):
        - ZERO backward compatibility requirements (in-house only, no releases)
        - Delete unused components, hooks, and services immediately

        No AI Attribution (CRITICAL - REJECT violations):
        - NO "Generated by Claude Code" comments
        - NO "Co-Authored-By: Claude" in any file

    - path: "star-proto/**/*.proto"
      instructions: |
        Review Protocol Buffer schemas (Boston Dynamics style):

        Style Requirements:
        - Proto3 syntax only (proto2 forbidden)
        - Line limit: 100 characters maximum
        - Indentation: 4 spaces (no tabs)
        - Message names: PascalCase (e.g., MotorControlRequest)
        - Field names: snake_case (e.g., velocity_mps, motor_id)
        - Enum names: PascalCase (e.g., MotorState)
        - Enum values: SCREAMING_SNAKE_CASE (e.g., MOTOR_STATE_IDLE)

        Mandatory Conventions:
        - Enum zero value MUST end with _UNKNOWN (e.g., MOTOR_STATE_UNKNOWN = 0)
        - Units: MKS system with suffixes (_mps, _rad, _ma, _celsius, _hz)
        - All RPC messages MUST include RequestHeader/ResponseHeader
        - Field numbers: Reserve 1-15 for frequent fields (1-byte encoding)

        nanopb Constraints (Embedded Target):
        - Configure max_size in .options files for all strings and repeated fields
        - Example: star.v1.RequestHeader.request_id max_size:64
        - No dynamic allocation - all strings/arrays must have fixed max sizes
        - Document size constraints in comments

        Breaking Changes (Relaxed for in-house project):
        - Field numbers CAN change if all consumers are updated in same PR
        - Field types CAN change if all consumers are updated
        - Fields CAN be removed if no longer used
        - Backward compatibility is NOT required (no public releases)
        - REQUIRED: Verify all code generation targets rebuild successfully
        - REQUIRED: Update all firmware, gateway, and ROS2 code in same PR for breaking changes
        - REQUIRED: Ensure main branch remains working after protobuf changes

        Validation:
        - Must pass: buf lint
        - Must pass: buf format
        - Must pass: buf build
        - PRs: buf breaking check against main branch
        - Generate targets: Go, TypeScript, nanopb (all three must build)

        Documentation:
        - Document all messages, fields, services, and RPCs
        - Explain units, ranges, and constraints
        - Reference related messages using fully-qualified names

    - path: "docs/**/*.tex"
      instructions: |
        Review LaTeX documentation:

        Technical Accuracy:
        - Verify measurements match actual hardware (voltages, currents, timings)
        - Verify pin assignments match schematic/PCB design
        - Verify protocol specifications match implementation code
        - Cross-reference code when documenting APIs and algorithms

        Content Organization:
        - Keep docs/sections/*.tex as source of truth (not compiled PDF)
        - Use consistent terminology with code (RequestHeader, ResponseHeader)
        - Include code examples from actual source files
        - Reference source files with relative paths

        Inclusive Terminology (CRITICAL - REJECT violations):
        - FORBIDDEN: master/slave, MOSI/MISO, blacklist/whitelist
        - REQUIRED: Controller/Peripheral, COPI/CIPO, denylist/allowlist

        Style:
        - Use \texttt{} for code/identifiers
        - Use \emph{} for emphasis (not \textbf{} unless critical)
        - Tables: Use booktabs package (\toprule, \midrule, \bottomrule)
        - Math: Use equation environments for formulas
        - Citations: Use \cite{} for references

        Consistency:
        - Match constant names with code (k_max_payload_size, not MAX_PAYLOAD_SIZE)
        - Match function names with code (rx_pid_compute, not rx_pid_update)
        - Match type names with code (rx_err_t, not error_t)

    - path: "**/*.md"
      instructions: |
        Review Markdown documentation:

        AI Attribution (CRITICAL - REJECT violations):
        - NO "Generated by Claude Code" footers
        - NO "Co-Authored-By: Claude" signatures
        - NO "Created with AI assistance" disclaimers
        - Keep all text professional and human-written
        - This applies to: commit messages, PR descriptions, README files, ALL markdown

        Inclusive Terminology (CRITICAL - REJECT violations):
        - FORBIDDEN: master/slave, MOSI/MISO, blacklist/whitelist
        - REQUIRED: Controller/Peripheral, COPI/CIPO, denylist/allowlist

        Technical Accuracy:
        - Reference .tex files in docs/sections/ for technical details (not PDFs)
        - Link to source code files for implementation details
        - Use relative paths for internal repository links
        - Verify commands/examples are correct and tested

        Formatting:
        - Use fenced code blocks with language identifiers (```c, ```go, ```bash)
        - Use tables for structured information
        - Use task lists for checklists (- [ ] item)
        - Keep line length readable (aim for 80-100 chars, not strict)

        Content:
        - Focus on "why" and "what", not just "how"
        - Include examples for non-obvious usage
        - Document edge cases and limitations
        - Link to related documentation

    - path: "**/CMakeLists.txt"
      instructions: |
        Review CMake build configuration:

        Project Standards (MANDATORY):
        - Minimum CMake version: 3.20
        - C standard: MUST be C23 (set(CMAKE_C_STANDARD 23) set(CMAKE_C_STANDARD_REQUIRED ON))
        - C++ standard: C++17 (set(CMAKE_CXX_STANDARD 17))
        - Position independent code: ON
        - C23 typed enums: ALL enums must specify underlying type (typedef enum : uint8_t { ... } name_t;)
        - Compiler must support C23 features: typed enums, #pragma once, designated initializers

        Compiler Flags (MANDATORY):
        - C/C++: -Wall -Wextra -Werror (treat warnings as errors)
        - C/C++: -Wpedantic (ISO standard compliance)
        - Release: -O2 (or -O3 for non-safety-critical)
        - Debug: -g -O0

        Target Organization:
        - Use target_include_directories(target PRIVATE/PUBLIC) not include_directories()
        - Use target_link_libraries(target PRIVATE/PUBLIC) not link_libraries()
        - Use target_compile_options(target PRIVATE) not add_compile_options()

        Testing:
        - Enable testing with enable_testing()
        - Add tests with add_test()
        - Use CTest for test execution

        Dependencies:
        - Document all find_package() calls
        - Check package availability before use
        - Provide clear error messages for missing dependencies

    - path: "scripts/**/*.sh"
      instructions: |
        Review shell scripts:

        Safety and Robustness:
        - Use bash shebang: #!/usr/bin/env bash
        - Enable strict mode: set -euo pipefail
        - Quote all variables: "$var" not $var
        - Check command existence: command -v foo || error
        - Validate inputs before use

        Error Handling:
        - Check exit codes: if ! command; then error; fi
        - Provide meaningful error messages
        - Clean up temporary files on error (trap)
        - Exit with non-zero on failure

        Style:
        - Use long options for readability: --verbose not -v
        - Document all functions with comments
        - Use lowercase for local variables
        - Use UPPERCASE for environment variables
        - Indent with 2 spaces

        Security:
        - Never use eval
        - Avoid executing user input
        - Validate file paths before operations
        - Use mktemp for temporary files

    - path: ".github/workflows/*.yml"
      instructions: |
        Review GitHub Actions workflows:

        Security:
        - Pin action versions to commit SHA (not @v1 or @latest)
        - Minimize permissions using permissions: key
        - Never expose secrets in logs
        - Use ${{ secrets.NAME }} for sensitive data

        Best Practices:
        - Use matrix strategy for multi-platform builds
        - Cache dependencies (actions/cache)
        - Fail fast when appropriate
        - Set timeout-minutes to prevent hanging
        - Use continue-on-error judiciously

        Testing:
        - Run tests before build
        - Run linters and formatters
        - Check for breaking changes (buf breaking for proto)
        - Report test results

        Artifacts:
        - Upload build artifacts for debugging
        - Upload test coverage reports
        - Set retention-days appropriately

    - path: "**/*_test.{go,c,cpp}"
      instructions: |
        Review test code:

        Coverage Requirements:
        - Test all public functions
        - Test error paths and edge cases
        - Test boundary conditions
        - Test concurrent access (if applicable)

        Test Organization:
        - One test file per source file (_test.go, _test.c)
        - Group related tests
        - Use descriptive test names (TestFunctionName_Scenario_ExpectedBehavior)
        - Use table-driven tests for multiple scenarios (Go)

        Assertions:
        - Use appropriate assertion macros/functions
        - Provide descriptive failure messages
        - Check all relevant outputs (return value, state changes, side effects)

        Mocking:
        - Mock external dependencies
        - Use dependency injection for testability
        - Verify mock expectations

        Performance:
        - Keep unit tests fast (<100ms per test)
        - Use benchmarks for performance-critical code
        - Set appropriate timeouts

  # Label configuration
  labeling_instructions:
    - label: "component:gateway"
      instructions: "Apply when changes affect star-gateway Go service (gRPC, SPI transport, HARQ, FEC, frame protocol)"
    - label: "component:firmware"
      instructions: "Apply when changes affect star-rx72n-firmware C code (motor control, PID, ThreadX, RX72N drivers)"
    - label: "component:ros2"
      instructions: "Apply when changes affect star-ros2 C++ nodes (ROS2 integration, lifecycle nodes)"
    - label: "component:proto"
      instructions: "Apply when changes affect star-proto Protocol Buffers (schemas, buf configuration, codegen)"
    - label: "component:docs"
      instructions: "Apply when changes affect documentation (LaTeX .tex files, markdown, CLAUDE.md files)"
    - label: "component:build"
      instructions: "Apply when changes affect build system (CMake, workflows, scripts, CI/CD)"
    - label: "component:ui"
      instructions: "Apply when changes affect star-ui TypeScript/React frontend (components, hooks, store, WebSocket connection, Vite config)"
    - label: "type:bug"
      instructions: "Apply for bug fixes and defect corrections"
    - label: "type:feature"
      instructions: "Apply for new functionality or capabilities"
    - label: "type:refactor"
      instructions: "Apply for code restructuring without behavior changes"
    - label: "type:test"
      instructions: "Apply for test additions, modifications, or test infrastructure changes"
    - label: "type:docs"
      instructions: "Apply for documentation-only changes"
    - label: "type:style"
      instructions: "Apply for formatting or naming changes without logic modifications"
    - label: "priority:critical"
      instructions: "Apply for safety violations (NASA Power of 10), security issues, inclusive terminology violations, or breaking changes"
    - label: "priority:high"
      instructions: "Apply for important bugs, blockers, or significant performance issues"
    - label: "priority:medium"
      instructions: "Apply for normal priority items"
    - label: "priority:low"
      instructions: "Apply for minor improvements, nice-to-have features, or small optimizations"
    - label: "standard:nasa-power-of-10"
      instructions: "Apply when changes relate to NASA Power of 10 rules (no recursion, no malloc, bounded loops, etc.)"
    - label: "standard:solid"
      instructions: "Apply when changes demonstrate or improve SOLID design principles"
    - label: "standard:inclusive-terminology"
      instructions: "Apply when changes update terminology (Controller/Peripheral, COPI/CIPO) or fix violations"
    - label: "standard:doxygen"
      instructions: "Apply when changes add or improve Doxygen documentation (comprehensive tagging, state diagrams, examples)"
    - label: "review:missing-docs"
      instructions: "Apply when code is missing required Doxygen documentation or documentation is incomplete"
    - label: "review:incomplete-diagrams"
      instructions: "Apply when state machines or complex flows lack required PlantUML/Graphviz/MSC diagrams"

  auto_apply_labels: true

  # Path filters
  path_filters:
    # Include paths
    - "star-gateway/**"
    - "star-rx72n-firmware/**"
    - "lib/**"
    - "src/**"
    - "tests/**"
    - "star-ros2/**"
    - "star-proto/**"
    - "docs/**"
    - "scripts/**"
    - "matlab/**"
    - "star-ui/**"
    - "*.md"
    - "CMakeLists.txt"
    - ".github/workflows/**"

    # Exclude build artifacts and generated files
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/.cmake/**"
    - "!**/gen/**"

    # Exclude archived and removed directories
    - "!**/archived/**"
    - "!Example144PinProject/**"

    # Exclude generated protobuf code
    - "!**/*.pb.go"
    - "!**/*.pb.h"
    - "!**/*.pb.c"
    - "!**/*.pb.ts"

    # Exclude dependency lock files (auto-generated)
    - "!**/go.sum"
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!**/pnpm-lock.yaml"

    # Exclude binary and media files
    - "!**/*.pdf"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.svg"
    - "!**/*.gif"
    - "!**/*.bin"
    - "!**/*.hex"
    - "!**/*.elf"
    - "!**/*.o"
    - "!**/*.a"
    - "!**/*.so"

    # Exclude version control and logs
    - "!.git/**"
    - "!**/*.log"
    - "!**/.DS_Store"

