# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit Configuration for STAR Project
#
# This configuration enforces:
# - NASA Power of 10 rules for safety-critical firmware
# - Comprehensive Doxygen documentation (ALL applicable tags, state diagrams, examples)
# - Inclusive terminology (Controller/Peripheral, COPI/CIPO)
# - Zero tolerance for magic numbers in C/C++
# - SOLID design principles
# - ZERO backward compatibility requirements (in-house only, no releases)
# - No AI attribution in commits/PRs
#
# BACKWARD COMPATIBILITY POLICY:
# This is an in-house project with NO public releases. Breaking changes are ENCOURAGED
# as long as main branch remains in a working state. REJECT any backward compatibility
# shims, deprecation warnings, function aliases, or compatibility layers.
#
# For more details, see:
# - CLAUDE.md (root) - Overall project guidelines
# - DOXYGEN_ROADMAP.md - Complete Doxygen documentation reference (25 sections, 100+ tags)
# - star-gateway/CLAUDE.md - Gateway architecture
# - star-rx72n-firmware/CLAUDE.md - Firmware development guide

# Tone instructions (general guidance, max 250 chars)
tone_instructions: "Assertive reviews enforcing: C23 (typed enums, #pragma once, uintptr_t for addresses), NASA Power of 10, comprehensive Doxygen, inclusive terminology (Controller/Peripheral), zero magic numbers, SOLID, no backward compatibility."

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  auto_title_placeholder: "@coderabbitai"

  # Path-specific instructions
  path_instructions:
    - path: "star-gateway/**/*.go"
      instructions: |
        Review Go gateway service code:
        - Follow standard Go conventions (gofmt, golint)
        - Verify interfaces are well-defined (Transport, HARQ, FEC)
        - Check error handling (all errors must be checked or explicitly ignored)
        - Verify layer separation: transport (L1), frame (L2), HARQ (L3), service (L5)
        - Ensure thread-safe operations for concurrent gRPC handlers
        - No magic numbers - use named constants
        - Follow gateway architecture from docs/sections/07_gateway_architecture.tex
        - Test coverage required for all new functions
        - Benchmark performance-critical paths (SPI, FEC, HARQ)

        Backward Compatibility (CRITICAL - REJECT violations):
        - ZERO backward compatibility requirements (in-house only, no releases)
        - Breaking changes are ENCOURAGED if they improve code quality
        - FORBIDDEN: Function aliases, deprecation warnings, compatibility shims
        - REQUIRED: Update all call sites directly when refactoring
        - REQUIRED: Ensure main branch remains in working state after changes

    - path: "{star-rx72n-firmware}/**/*.{c,h}"
      instructions: |
        Review C firmware code with STRICT C23 compliance checking:

        C23 Language Standard (MANDATORY):
        - REQUIRED: C23 standard ONLY - this is NOT a C11/C99/C89 project
        - REQUIRED: Typed enums with explicit underlying types (C23 feature): `typedef enum : uint8_t { ... } name_t;`
        - REQUIRED: `#pragma once` for ALL header files (C23 standard, NOT traditional include guards)
        - ALLOWED: C99-style for-loop variable declarations: `for (uint8_t i = 0; ...)`
        - ALLOWED: Designated initializers: `struct foo x = { .field = value }`
        - ALLOWED: Compound literals: `(struct foo){ .field = value }`
        - FORBIDDEN: Traditional include guards (#ifndef/#define/#endif)
        - FORBIDDEN: Untyped enums without explicit underlying type
        - FORBIDDEN: C89 loop style (declaring loop counters before for-statement)
        - FORBIDDEN: Old-style function declarations (K&R style)

        Doxygen Documentation (CRITICAL - MAXIMUM COVERAGE REQUIRED):
        - ZERO TOLERANCE for undocumented code - ALL elements must have comprehensive Doxygen comments
        - See DOXYGEN_ROADMAP.md for complete reference (25 subsections, 100+ tags, exhaustive templates)
        - REJECT any PR with missing or incomplete documentation

        Documentation Requirements by Element Type:

        Functions (MANDATORY tags):
        - @brief (one-line summary)
        - @details (multi-paragraph with algorithm explanation)
        - @param[in/out/in,out] for ALL parameters (with direction, valid range, units, constraints)
        - @return (return value description)
        - @retval for EVERY possible return value (k_rx_ok, all error codes)
        - @pre (preconditions, minimum 2 per NASA Rule 5)
        - @post (postconditions, minimum 2 per NASA Rule 5)
        - @note (thread safety statement REQUIRED)
        - @code (usage example if non-trivial)
        - @see (cross-references to related functions)
        - @since (version introduced)
        Additional when applicable: @par (Thread Safety/Performance/Re-entrancy/State Machine), @warning, @attention, @invariant, @todo (with issue tracker), @bug (with issue tracker), @deprecated, @test, @startuml/@dot/@msc (diagrams), @callgraph/@callergraph

        Structs/Enums (MANDATORY tags):
        - @struct/@enum (structure/enumeration tag)
        - @brief (one-line summary)
        - @details (detailed explanation)
        - /**< inline comment for EVERY member/value with full explanation
        - @invariant (constraints on fields)
        - @code (usage example)
        - @see (related types)
        - @since (version introduced)
        - State machines MUST include @startuml diagram showing all transitions

        Variables (MANDATORY tags):
        - @var/@def (variable/macro tag)
        - @brief (one-line summary)
        - @details (purpose and usage)
        - @note (access restrictions)
        - @warning (direct modification warnings for static variables)
        - @since (version introduced)

        State Machines (MANDATORY):
        - @startuml state diagram showing all state transitions
        - Each state documented with entry/exit actions
        - Transition conditions and guards documented
        - State transition table in @par section

        File Headers (MANDATORY):
        - @file (filename)
        - @brief (one-line summary)
        - @details (multi-paragraph explanation)
        - Hardware requirements (if applicable)
        - NASA Power of 10 compliance section (@par)
        - SOLID principles adherence (@par)
        - Links to related .tex documentation (@see)
        - @author, @date, @version, @copyright

        Enforcement Rules:
        - If a tag is applicable, it MUST be used (do not omit tags)
        - All struct members must have inline /**< comments
        - All enum values must have inline /**< comments with full explanation
        - State machines require PlantUML diagrams (@startuml/@enduml)
        - Complex flows require Graphviz diagrams (@dot/@enddot)
        - Protocol sequences require MSC diagrams (@msc/@endmsc)
        - Every @todo and @bug must reference issue tracker ticket
        - All function examples must use @code/@endcode
        - All cross-references must use @see/@sa/@ref
        - Pre/post conditions minimum 2 each (NASA Rule 5)

        NASA Power of 10 Rules (CRITICAL - REJECT violations):
        - Rule 1: No goto, setjmp/longjmp, or recursion
        - Rule 2: All loops must have statically provable bounds (use enums for limits)
        - Rule 3: Zero malloc/free/realloc (static allocation only)
        - Rule 4: Functions must be <=60 lines
        - Rule 5: Minimum 2 assertions per function (pre/post conditions using RX_CHECK macros)
        - Rule 8: Enums for ALL integer constants (ZERO TOLERANCE for magic numbers)
        - Rule 9: Function pointers ALLOWED for Dependency Inversion Principle (intentional deviation)
        - Rule 10: Must compile with -Wall -Wextra -Werror (zero warnings)

        Inclusive Terminology (CRITICAL - REJECT violations):
        - FORBIDDEN: master/slave, MOSI/MISO, blacklist/whitelist
        - REQUIRED: Controller/Peripheral, COPI/CIPO, denylist/allowlist

        Code Style (MANDATORY):
        - Naming: snake_case for functions/variables, SCREAMING_SNAKE_CASE for macros/enums
        - Enums for ALL integer constants including: array indices, bit shifts, protocol offsets, bit masks
        - const float ONLY for floating-point (enum cannot represent floats)
        - Macros ONLY for: reducing code duplication, conditional compilation, build configuration flags
        - Hardware register access: Use inline accessor functions with enum addresses (NEVER macros)
        - Include guards: MANDATORY use of #pragma once (C23 standard, NOT traditional guards)
        - Doxygen: /** for multi-line blocks, /**< for inline comments
        - Line limit: 100 characters maximum

        Hardware Address Enums (CRITICAL - REJECT violations):
        - MANDATORY: All enums whose values are hardware memory-mapped addresses MUST use `uintptr_t`
          as the underlying type: `typedef enum : uintptr_t { k_foo_base = 0x00088000, } foo_addr_t;`
        - FORBIDDEN: `typedef enum : uint32_t { k_foo_base = 0x00088000, }` for address enums.
          On the 64-bit x86_64 unit-test host uintptr_t is 8 bytes; uint32_t silently truncates
          pointer casts and produces wrong addresses in tests.
        - ALLOWED: uint32_t for large non-address constants (bit masks, large timeouts, CRC values)
        - REQUIRED: Inline accessor functions cast the enum to a pointer directly:
          `static inline Foo_Type* foo(void) { return (Foo_Type*)k_foo_base; }`
        - Doxygen @code examples that show address arithmetic MUST use uintptr_t, never uint32_t

        Backward Compatibility (CRITICAL - REJECT violations):
        - ZERO backward compatibility requirements (in-house only, no releases)
        - Breaking changes are ENCOURAGED if they improve code quality
        - FORBIDDEN: Function aliases (e.g., #define old_name new_name)
        - FORBIDDEN: Deprecation macros, compatibility shims, wrapper functions
        - REQUIRED: Update all call sites directly when refactoring APIs
        - REQUIRED: Delete old code immediately - no gradual transitions
        - REQUIRED: Ensure main branch remains in working state after changes

        Magic Numbers (ZERO TOLERANCE):
        - ALL numeric literals must be named enums or const
        - This includes: 0, 1, array indices, bit positions, timeouts, buffer sizes
        - Example: buf[k_idx_high_byte] not buf[0]
        - Example: (val >> k_shift_byte) not (val >> 8)

        SOLID Principles:
        - Single Responsibility: One module = one purpose (e.g., rx_pid only does PID math)
        - Open/Closed: Extensible via config structs (rx_pid_config_t)
        - Liskov Substitution: Bus interface implementations interchangeable
        - Interface Segregation: Small focused APIs (rx_pid has 7 functions)
        - Dependency Inversion: Use function pointer interfaces for hardware abstraction

        Validation Requirements:
        - Pre-conditions: NULL checks, state validation, range checks
        - Post-conditions: Output bounds, invariant validation
        - Use RX_CHECK_NULL_PTR, RX_RETURN_ON_ERROR macros

