[package]
name = "star-docs"
version = "0.1.0"
edition = "2024"
description = "STAR documentation pipeline: Doxygen XML -> Typst -> PDF"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1.10"
indicatif = "0.17"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
regex = "1"
