; PlatformIO Project Configuration File
; ESP32 Firmware - Migrated from ESP-IDF
;
; Build environments for different ESP32 board variants

[platformio]
default_envs = esp32_wroom
src_dir = src
lib_dir = lib
test_dir = test
include_dir = include

; ============================================
; Common settings for all environments
; ============================================
[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
test_framework = unity
; Use deep LDF mode to resolve transitive dependencies from library.json
lib_ldf_mode = deep

; Build flags common to all environments
build_flags =
    -DSTAR_FIRMWARE_VERSION=\"1.0.0\"
    -DLOG_LOCAL_LEVEL=ESP_LOG_INFO
    ; Kconfig equivalents for star_bus component
    -DCONFIG_STAR_KCONFIG_BUS_MUTEX_TIMEOUT_MS=1000
    -DCONFIG_STAR_KCONFIG_BUS_MAX_NAME_LEN=32
    -DCONFIG_STAR_KCONFIG_BUS_DEFAULT_TIMEOUT_MS=1000
    -DCONFIG_STAR_KCONFIG_BUS_STATS_ENABLED=1
    ; RTL dump for Egypt call graph generation
    -fdump-rtl-expand

; ============================================
; ESP32-WROOM-32 (4MB Flash)
; ============================================
[env:esp32_wroom]
board = esp32dev
board_build.partitions = partitions/partitions_4mb.csv

; Core dependencies + sensors used by main.c
lib_deps =
    lib/star_core
    lib/star_error_handler
    lib/star_pin_validator
    lib/star_bus
    lib/star_sensor_hcsr04
    lib/star_sensor_pca9685
    lib/star_servo

build_flags =
    ${env.build_flags}
    -DCONFIG_STAR_BOARD_ESP32_WROOM_32=1
    ; I2C defaults for ESP32-WROOM-32
    -DCONFIG_STAR_I2C_SDA_GPIO=21
    -DCONFIG_STAR_I2C_SCL_GPIO=22
    ; SPI defaults
    -DCONFIG_STAR_SPI_MOSI_GPIO=23
    -DCONFIG_STAR_SPI_MISO_GPIO=19
    -DCONFIG_STAR_SPI_CLK_GPIO=18
    -DCONFIG_STAR_SPI_CS_GPIO=5
    ; UART defaults
    -DCONFIG_STAR_UART_TX_GPIO=17
    -DCONFIG_STAR_UART_RX_GPIO=16

; ============================================
; ESP32-S3-WROOM-1-N16 (16MB Flash + 8MB PSRAM)
; ============================================
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions/partitions_16mb.csv

; Core dependencies + sensors used by main.c
lib_deps =
    lib/star_core
    lib/star_error_handler
    lib/star_pin_validator
    lib/star_bus
    lib/star_sensor_hcsr04
    lib/star_sensor_pca9685
    lib/star_servo

build_flags =
    ${env.build_flags}
    -DCONFIG_STAR_BOARD_ESP32_S3_WROOM_1_N16=1
    -DBOARD_HAS_PSRAM
    ; I2C defaults for ESP32-S3
    -DCONFIG_STAR_I2C_SDA_GPIO=8
    -DCONFIG_STAR_I2C_SCL_GPIO=9
    ; SPI defaults
    -DCONFIG_STAR_SPI_MOSI_GPIO=11
    -DCONFIG_STAR_SPI_MISO_GPIO=13
    -DCONFIG_STAR_SPI_CLK_GPIO=12
    -DCONFIG_STAR_SPI_CS_GPIO=10
    ; UART defaults
    -DCONFIG_STAR_UART_TX_GPIO=43
    -DCONFIG_STAR_UART_RX_GPIO=44
