version: "1.0"
linter: qodana-cpp
profile:
  name: qodana.recommended

bootstrap: cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -S star-rx72n-firmware -B build

exclude:
  - name: All
    paths:
      - star-rx72n-firmware/lib/threadx
      - star-rx72n-firmware/lib/rx_nanopb/nanopb

include:
  - name: CheckDependencyLicenses