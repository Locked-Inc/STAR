// battery_management.proto - STAR Battery Management Protocol Buffer Definitions
// BQ7850 BMS monitoring and control service for battery pack management.
//
// Following Boston Dynamics style guide:
// - Proto3 only, 100 char line limit, 4 space indent
// - MKS units with suffixes (_mv, _ma, _mw, _deci_celsius)
// - All fields documented with units and valid ranges
//
// STAR Project - Texas A&M University
// December 2025

syntax = "proto3";

package star.v1;

import "star/v1/common.proto";

option go_package = "github.com/Locked-Inc/star-proto/gen/go/star/v1;starv1";
option java_multiple_files = true;
option java_outer_classname = "BatteryManagementProto";
option java_package = "com.star.proto.v1";

// Battery management service for BQ7850 BMS monitoring and control.
// Provides state queries, streaming telemetry, protection configuration,
// cell balancing, and FET control for lithium-ion battery packs.
service BatteryManagementService {
  // Get current battery state (cells, temps, current, SOC, status).
  // Returns a complete snapshot of all battery parameters.
  rpc GetBatteryState(GetBatteryStateRequest) returns (GetBatteryStateResponse);

  // Stream battery state at configured rate.
  // Server streams battery state updates continuously.
  rpc StreamBatteryState(StreamBatteryStateRequest) returns (stream BatteryState);

  // Get protection thresholds configuration.
  rpc GetProtectionThresholds(GetProtectionThresholdsRequest) returns (GetProtectionThresholdsResponse);

  // Set protection thresholds (requires device unsealed).
  rpc SetProtectionThresholds(SetProtectionThresholdsRequest) returns (SetProtectionThresholdsResponse);

  // Enable cell balancing for specified cells.
  rpc EnableCellBalancing(EnableCellBalancingRequest) returns (EnableCellBalancingResponse);

  // Disable all cell balancing.
  rpc DisableCellBalancing(DisableCellBalancingRequest) returns (DisableCellBalancingResponse);

  // Get cell balancing status.
  rpc GetBalancingStatus(GetBalancingStatusRequest) returns (GetBalancingStatusResponse);

  // Control charge/discharge FETs.
  rpc ControlFets(ControlFetsRequest) returns (ControlFetsResponse);

  // Get BMS device information (manufacturer, serial, chemistry).
  rpc GetDeviceInfo(GetDeviceInfoRequest) returns (GetDeviceInfoResponse);

  // Reset BMS device (soft reset).
  rpc ResetDevice(ResetDeviceRequest) returns (ResetDeviceResponse);
}

// Request for battery state.
message GetBatteryStateRequest {
  // Standard request header.
  RequestHeader header = 1;
}

// Response with complete battery state.
message GetBatteryStateResponse {
  // Standard response header with status.
  ResponseHeader header = 1;

  // Complete battery state.
  BatteryState state = 2;
}

// Request to stream battery state.
message StreamBatteryStateRequest {
  // Standard request header.
  RequestHeader header = 1;

  // Desired update rate in Hz.
  // Valid range: 1 to 10 Hz (BMS sampling limitation).
  int32 rate_hz = 2;
}

// Complete battery state from BMS.
// Composite of all battery parameters.
message BatteryState {
  // Individual cell voltage data.
  CellData cells = 1;

  // Temperature sensor data.
  TemperatureData temperatures = 2;

  // Current and power measurements.
  CurrentData current = 3;

  // State of charge information.
  StateOfChargeData soc = 4;

  // Battery status flags.
  BatteryStatus status = 5;

  // Timestamp in microseconds since boot.
  int64 timestamp_us = 6;
}

// Individual cell voltage data.
// Maps to bq7850_cell_data_t.
message CellData {
  // Individual cell voltages in millivolts.
  // Array index 0 = cell 1, index 1 = cell 2, etc.
  // Valid range per cell: 2500-4500 mV typical.
  // Maximum 16 cells supported by BQ7850.
  repeated uint32 cell_mv = 1;

  // Number of valid cell readings.
  // Range: 1 to 16.
  int32 valid_cells = 2;

  // Total pack voltage in millivolts.
  // Sum of all cell voltages.
  uint32 pack_mv = 3;

  // Minimum cell voltage in millivolts.
  uint32 min_cell_mv = 4;

  // Maximum cell voltage in millivolts.
  uint32 max_cell_mv = 5;

  // Cell voltage delta (max - min) in millivolts.
  // Indicates cell imbalance.
  uint32 delta_mv = 6;
}

// Temperature sensor data.
// Maps to bq7850_temp_data_t.
message TemperatureData {
  // Temperature readings in deci-celsius (0.1C units).
  // Example: 253 = 25.3C.
  // Maximum 3 sensors supported by BQ7850.
  repeated int32 temp_deci_celsius = 1;

  // Number of valid temperature sensors.
  // Range: 0 to 3.
  int32 valid_sensors = 2;

  // Average temperature in deci-celsius.
  int32 avg_temp_deci_celsius = 3;

  // Minimum temperature in deci-celsius.
  int32 min_temp_deci_celsius = 4;

  // Maximum temperature in deci-celsius.
  int32 max_temp_deci_celsius = 5;
}

// Current and power measurements.
// Maps to bq7850_current_data_t.
message CurrentData {
  // Instantaneous current in milliamps.
  // Positive = charging, negative = discharging.
  int32 current_ma = 1;

  // Average current in milliamps.
  int32 avg_current_ma = 2;

  // Pack voltage in millivolts.
  uint32 voltage_mv = 3;

  // Calculated power in milliwatts.
  // Positive = charging, negative = discharging.
  int32 power_mw = 4;
}

// State of charge information.
// Maps to bq7850_soc_data_t.
message StateOfChargeData {
  // Remaining capacity in milliamp-hours.
  uint32 remaining_capacity_mah = 1;

  // Full charge capacity in milliamp-hours.
  uint32 full_capacity_mah = 2;

  // Design capacity in milliamp-hours.
  uint32 design_capacity_mah = 3;

  // Relative state of charge (0-100%).
  // Percentage of full_capacity_mah remaining.
  int32 relative_soc_percent = 4;

  // Absolute state of charge (0-100%).
  // Percentage of design_capacity_mah remaining.
  int32 absolute_soc_percent = 5;

  // Number of charge/discharge cycles.
  uint32 cycle_count = 6;
}

// Battery status flags.
// Maps to bq7850_status_t.
message BatteryStatus {
  // Raw battery status register value.
  uint32 battery_status_register = 1;

  // Raw safety status register value.
  uint32 safety_status_register = 2;

  // Raw operation status register value.
  uint32 operation_status_register = 3;

  // Raw alarm/warning register value.
  uint32 alarm_warning_register = 4;

  // True if battery is currently charging.
  bool charging = 5;

  // True if battery is currently discharging.
  bool discharging = 6;

  // True if battery is fully charged.
  bool fully_charged = 7;

  // True if battery is fully discharged.
  bool fully_discharged = 8;

  // True if any fault condition is active.
  bool fault_active = 9;

  // Decoded safety fault flags.
  SafetyFaults safety_faults = 10;

  // Current battery operating state.
  BatteryStateEnum state = 11;
}

// Safety fault flags decoded from safety_status register.
message SafetyFaults {
  // Cell undervoltage fault.
  bool cell_undervoltage = 1;

  // Cell overvoltage fault.
  bool cell_overvoltage = 2;

  // Overcurrent in charge.
  bool overcurrent_charge = 3;

  // Overcurrent in discharge.
  bool overcurrent_discharge = 4;

  // Over-temperature in charge.
  bool overtemp_charge = 5;

  // Over-temperature in discharge.
  bool overtemp_discharge = 6;

  // Under-temperature in charge.
  bool undertemp_charge = 7;

  // Under-temperature in discharge.
  bool undertemp_discharge = 8;
}

// Battery operating state.
enum BatteryStateEnum {
  // Unknown state.
  BATTERY_STATE_ENUM_UNKNOWN = 0;

  // Battery is idle (not charging or discharging).
  BATTERY_STATE_ENUM_IDLE = 1;

  // Battery is charging.
  BATTERY_STATE_ENUM_CHARGING = 2;

  // Battery is discharging.
  BATTERY_STATE_ENUM_DISCHARGING = 3;

  // Battery is fully charged.
  BATTERY_STATE_ENUM_FULL = 4;

  // Battery is in fault condition.
  BATTERY_STATE_ENUM_FAULT = 5;

  // Battery is in sleep/low-power mode.
  BATTERY_STATE_ENUM_SLEEP = 6;
}

// Protection thresholds configuration.
// Maps to bq7850_protection_t.
message ProtectionThresholds {
  // Overvoltage threshold per cell in millivolts.
  // Typical range: 4200-4350 mV for Li-ion.
  uint32 overvoltage_mv = 1;

  // Undervoltage threshold per cell in millivolts.
  // Typical range: 2500-3000 mV for Li-ion.
  uint32 undervoltage_mv = 2;

  // Overcharge current threshold in milliamps.
  uint32 overcharge_ma = 3;

  // Overdischarge current threshold in milliamps.
  uint32 overdischarge_ma = 4;

  // Over-temperature threshold in deci-celsius.
  // Example: 600 = 60.0C.
  int32 overtemp_deci_celsius = 5;

  // Under-temperature threshold in deci-celsius.
  // Example: 0 = 0.0C.
  int32 undertemp_deci_celsius = 6;
}

// Request to get protection thresholds.
message GetProtectionThresholdsRequest {
  // Standard request header.
  RequestHeader header = 1;
}

// Response with protection thresholds.
message GetProtectionThresholdsResponse {
  // Standard response header with status.
  ResponseHeader header = 1;

  // Current protection thresholds.
  ProtectionThresholds thresholds = 2;
}

// Request to set protection thresholds.
message SetProtectionThresholdsRequest {
  // Standard request header.
  RequestHeader header = 1;

  // New protection thresholds to apply.
  ProtectionThresholds thresholds = 2;
}

// Response to set protection thresholds.
message SetProtectionThresholdsResponse {
  // Standard response header with status.
  ResponseHeader header = 1;
}

// Request to enable cell balancing.
message EnableCellBalancingRequest {
  // Standard request header.
  RequestHeader header = 1;

  // Bitmask of cells to balance.
  // Bit 0 = cell 1, bit 1 = cell 2, etc.
  // Maximum 16 bits (cells 1-16).
  uint32 cell_mask = 2;
}

// Response to enable cell balancing.
message EnableCellBalancingResponse {
  // Standard response header with status.
  ResponseHeader header = 1;
}

// Request to disable cell balancing.
message DisableCellBalancingRequest {
  // Standard request header.
  RequestHeader header = 1;
}

// Response to disable cell balancing.
message DisableCellBalancingResponse {
  // Standard response header with status.
  ResponseHeader header = 1;
}

// Request to get balancing status.
message GetBalancingStatusRequest {
  // Standard request header.
  RequestHeader header = 1;
}

// Response with balancing status.
message GetBalancingStatusResponse {
  // Standard response header with status.
  ResponseHeader header = 1;

  // Bitmask of cells currently balancing.
  // Bit 0 = cell 1 balancing, bit 1 = cell 2 balancing, etc.
  uint32 active_cell_mask = 2;
}

// Request to control FETs.
message ControlFetsRequest {
  // Standard request header.
  RequestHeader header = 1;

  // Enable charge FET (allows charging).
  bool enable_charge_fet = 2;

  // Enable discharge FET (allows discharging).
  bool enable_discharge_fet = 3;
}

// Response to FET control.
message ControlFetsResponse {
  // Standard response header with status.
  ResponseHeader header = 1;

  // Current charge FET state after command.
  bool charge_fet_enabled = 2;

  // Current discharge FET state after command.
  bool discharge_fet_enabled = 3;
}

// Request for device information.
message GetDeviceInfoRequest {
  // Standard request header.
  RequestHeader header = 1;
}

// Response with device information.
message GetDeviceInfoResponse {
  // Standard response header with status.
  ResponseHeader header = 1;

  // BMS device information.
  BmsDeviceInfo device_info = 2;
}

// BMS device information.
// Maps to bq7850_device_info_t.
message BmsDeviceInfo {
  // Device type identifier.
  uint32 device_type = 1;

  // Firmware version (raw register value from BQ7850).
  // BQ7850 returns this as a 16-bit packed value.
  uint32 firmware_version = 2;

  // Hardware version (raw register value from BQ7850).
  // BQ7850 returns this as a 16-bit packed value.
  uint32 hardware_version = 3;

  // Device serial number (raw register value from BQ7850).
  // BQ7850 stores this as a 32-bit integer in data flash.
  uint32 serial_number = 4;

  // Manufacturer name (max 32 chars).
  string manufacturer = 5;

  // Device name (max 32 chars).
  string device_name = 6;

  // Battery chemistry type (e.g., "LION", "LIFEPO4").
  string chemistry = 7;
}

// Request to reset BMS device.
message ResetDeviceRequest {
  // Standard request header.
  RequestHeader header = 1;
}

// Response to device reset.
message ResetDeviceResponse {
  // Standard response header with status.
  ResponseHeader header = 1;

  // True if reset was initiated.
  // Device will be unavailable for ~1 second after reset.
  bool reset_initiated = 2;
}
