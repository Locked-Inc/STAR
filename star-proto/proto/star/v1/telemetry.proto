// telemetry.proto - STAR Telemetry Protocol Buffer Definitions
// Real-time sensor data streaming service.
//
// Following Boston Dynamics style guide:
// - Proto3 only, 100 char line limit, 4 space indent
// - MKS units (meters, radians, Celsius)
// - All fields documented with units
//
// Copyright (c) 2026 Locked Inc.
// SPDX-License-Identifier: MIT

syntax = "proto3";

package star.v1;

import "google/protobuf/timestamp.proto";
import "star/v1/common.proto";
import "star/v1/motor_control.proto";

option go_package = "github.com/Locked-Inc/star-proto/gen/go/star/v1;starv1";
option java_multiple_files = true;
option java_outer_classname = "TelemetryProto";
option java_package = "com.star.proto.v1";

// Telemetry streaming service for real-time sensor data.
// Provides system status, IMU data, and configurable streaming.
service TelemetryService {
  // Get current telemetry snapshot.
  // Returns all available sensor data.
  rpc GetTelemetry(GetTelemetryRequest) returns (GetTelemetryResponse);

  // Stream telemetry at specified rate.
  // Server streams sensor data at configured frequency.
  rpc StreamTelemetry(StreamTelemetryRequest) returns (stream TelemetryData);

  // Get system status information.
  // Returns connection states, firmware version, uptime.
  rpc GetSystemStatus(GetSystemStatusRequest) returns (GetSystemStatusResponse);
}

// Request for telemetry snapshot.
message GetTelemetryRequest {
  // Standard request header.
  RequestHeader header = 1;
}

// Response with telemetry snapshot.
message GetTelemetryResponse {
  // Standard response header.
  ResponseHeader header = 1;

  // Current telemetry data.
  TelemetryData telemetry = 2;
}

// Request to stream telemetry.
message StreamTelemetryRequest {
  // Standard request header.
  RequestHeader header = 1;

  // Desired update rate in Hz.
  // Valid range: 1 to 100 Hz.
  int32 rate_hz = 2;

  // Fields to include (empty = all fields).
  repeated string fields = 3;
}

// Request for system status.
message GetSystemStatusRequest {
  // Standard request header.
  RequestHeader header = 1;
}

// Response with system status.
message GetSystemStatusResponse {
  // Standard response header.
  ResponseHeader header = 1;

  // System status information.
  SystemStatus status = 2;
}

// Complete telemetry snapshot from all sensors.
message TelemetryData {
  // Reserved field names from removed Battery Management subsystem.
  // Field 3 was previously `double battery_percent` (incompatible wire type with
  //   the current `ObstacleData obstacle` at field 3 -- old senders' fixed64
  //   bytes would be misread as a length-prefix without these reservations).
  // Field 12 was previously `double battery_voltage_v` (now `BaroData baro`).
  // See git: 4f6c255f3 "Remove BMS/battery monitoring from STAR project (#359)".
  reserved "battery_percent", "battery_voltage_v";

  // IMU sensor data.
  ImuData imu = 1;

  // GPS data (if available).
  GpsData gps = 2;

  // Obstacle detection data from ultrasonic sensors (RX72N specific).
  ObstacleData obstacle = 3;

  // WiFi signal strength in dBm.
  // Typical range: -100 to -30 dBm.
  int32 wifi_signal_dbm = 4;

  // CPU usage percentage.
  // Range: 0 to 100 percent.
  double cpu_usage_percent = 5;

  // Temperature in Celsius (from DS18B20 sensor).
  double temperature_celsius = 6;

  // Motor load percentage (average across motors).
  // Range: 0 to 100 percent.
  double motor_load_percent = 7;

  // Telemetry timestamp.
  google.protobuf.Timestamp timestamp = 8;

  // Emergency stop reason (RX72N specific). Populated when emergency_stop is true.
  EstopReason estop_reason = 9;

  // Emergency stop state (RX72N specific).
  bool emergency_stop = 10;

  // Motor fault flags bitfield (RX72N specific).
  // Bit 0: Motor 0 fault (DRV8263 nFAULT; see encoder[0] for position)
  // Bit 1: Motor 1 fault (DRV8263 nFAULT; see encoder[1] for position)
  // Bit 2: Motor 2 fault (DRV8263 nFAULT; see encoder[2] for position)
  // Bit 3: Motor 3 fault (DRV8263 nFAULT; see encoder[3] for position)
  // Bits 4-31: Reserved, always zero.
  uint32 fault_flags = 11;

  // Barometric pressure and temperature from BMP280 (RX72N specific).
  BaroData baro = 12;

  // Field 13 was reserved during IMU integration (never assigned in production).
  reserved 13;

  // Timestamp in microseconds since boot (RX72N specific).
  int64 timestamp_us = 14;

  // Encoder data from motors (RX72N specific - fixed size for embedded).
  // Front left motor encoder data.
  star.v1.EncoderData encoder_front_left = 15;
  // Front right motor encoder data.
  star.v1.EncoderData encoder_front_right = 16;
  // Back left motor encoder data (reserved for future 4-motor support).
  star.v1.EncoderData encoder_back_left = 17;
  // Back right motor encoder data (reserved for future 4-motor support).
  star.v1.EncoderData encoder_back_right = 18;

  // Frame sequence number from transport layer for drop detection.
  // Increments with each transmitted frame. Used by diagnostics to detect
  // missing frames in the telemetry stream.
  uint32 frame_sequence = 19;
}

// IMU sensor data from BNO055 NDOF fusion mode.
// Euler angles use MKS units (radians) for ROS2 compatibility.
// Quaternion components provided for 3D orientation without gimbal lock.
message ImuData {
  // Pitch angle in radians.
  // Range: -pi/2 to pi/2.
  double pitch_rad = 1;

  // Roll angle in radians.
  // Range: -pi to pi.
  double roll_rad = 2;

  // Yaw angle in radians.
  // Range: -pi to pi.
  double yaw_rad = 3;

  // Linear acceleration X in meters per second squared.
  // Gravity-compensated (BNO055 LINEAR_ACCEL register).
  double accel_x_mps2 = 4;

  // Linear acceleration Y in meters per second squared.
  // Gravity-compensated (BNO055 LINEAR_ACCEL register).
  double accel_y_mps2 = 5;

  // Linear acceleration Z in meters per second squared.
  // Gravity-compensated (BNO055 LINEAR_ACCEL register).
  // At rest, should read approximately 0.0 m/s^2 (gravity removed).
  double accel_z_mps2 = 6;

  // Angular velocity X (roll rate) in radians per second.
  double gyro_x_rad_per_s = 7;

  // Angular velocity Y (pitch rate) in radians per second.
  double gyro_y_rad_per_s = 8;

  // Angular velocity Z (yaw rate) in radians per second.
  double gyro_z_rad_per_s = 9;

  // Compass heading (Euler heading from BNO055 NDOF fusion) in radians.
  // Range: 0.0 to 2*pi radians (0 to 6.283185). 0 = North, pi/2 = East.
  // Derived from heading_deg16 register value / 16.0 * (pi / 180.0).
  double heading_rad = 10;

  // Quaternion W component (scalar part). Range: -1.0 to 1.0.
  // Derived from BNO055 QUA_DATA register / 16384.0.
  // Convention: BNO055 outputs Hamilton-convention quaternions (scalar-first
  // internally). Maps to ROS2 geometry_msgs/Quaternion as follows:
  //   geometry_msgs::Quaternion.x = quat_x
  //   geometry_msgs::Quaternion.y = quat_y
  //   geometry_msgs::Quaternion.z = quat_z
  //   geometry_msgs::Quaternion.w = quat_w
  double quat_w = 11;

  // Quaternion X component. Range: -1.0 to 1.0.
  double quat_x = 12;

  // Quaternion Y component. Range: -1.0 to 1.0.
  double quat_y = 13;

  // Quaternion Z component. Range: -1.0 to 1.0.
  double quat_z = 14;

  // BNO055 calibration status byte (raw CALIB_STAT register 0x35).
  // Bits [7:6] = SYS calibration (0=uncal, 3=fully cal).
  // Bits [5:4] = Gyroscope calibration.
  // Bits [3:2] = Accelerometer calibration.
  // Bits [1:0] = Magnetometer calibration.
  uint32 calibration_status = 15;

  // BNO055 on-chip temperature in degrees Celsius.
  // Range: -40.0 to +85.0 degC.
  double temperature_celsius = 16;
}

// Barometric pressure and temperature data from BMP280.
// Provides atmospheric pressure for altitude estimation and ambient temperature.
message BaroData {
  // Compensated temperature in degrees Celsius.
  // Range: -40.0 to +85.0 degC.
  // Derived from BMP280 temp_centi_degc / 100.0.
  double temperature_celsius = 1;

  // Compensated atmospheric pressure in Pascals.
  // Typical range: 30000 to 110000 Pa (300 to 1100 hPa).
  // Derived from BMP280 press_pa_256 / 256.0.
  double pressure_pa = 2;
}

// Obstacle detection data from ultrasonic sensors (RX72N specific).
// Reports distance and detection state from 4 HC-SR04 sensors.
message ObstacleData {
  // Distance from sensor 0 in meters. 0.0 if sensor invalid.
  float distance_front_left_m = 1;

  // Distance from sensor 1 in meters. 0.0 if sensor invalid.
  float distance_front_right_m = 2;

  // Distance from sensor 2 in meters. 0.0 if sensor invalid.
  float distance_back_left_m = 3;

  // Distance from sensor 3 in meters. 0.0 if sensor invalid.
  float distance_back_right_m = 4;

  // Any sensor has detected an obstacle within threshold distance.
  bool any_obstacle = 5;

  // Per-sensor detection bitmask. Bit N set = sensor N detected obstacle.
  // Bit 0: sensor 0, Bit 1: sensor 1, Bit 2: sensor 2, Bit 3: sensor 3.
  uint32 detected_mask = 6;
}

// GPS position data.
message GpsData {
  // WGS84 latitude in degrees.
  // Range: -90 to 90.
  double latitude_deg = 1;

  // WGS84 longitude in degrees.
  // Range: -180 to 180.
  double longitude_deg = 2;

  // Altitude above sea level in meters.
  double altitude_m = 3;

  // Horizontal accuracy estimate in meters.
  double accuracy_m = 4;

  // Number of satellites in view.
  int32 satellites = 5;

  // GPS fix type.
  GpsFix fix_type = 6;
}

// Emergency stop reason enumeration.
// Identifies the cause of an active emergency stop condition on the RX72N.
enum EstopReason {
  // Unknown or no emergency stop active.
  ESTOP_REASON_UNKNOWN = 0;

  // Manual emergency stop requested via software command.
  ESTOP_REASON_MANUAL = 1;

  // Motor driver hardware fault detected (nFAULT signal asserted).
  ESTOP_REASON_FAULT = 2;

  // Communication timeout: no command received within watchdog window.
  ESTOP_REASON_COMM_TIMEOUT = 3;

  // Obstacle detected too close by ultrasonic sensors.
  ESTOP_REASON_OBSTACLE = 4;

  // Motor overcurrent condition detected.
  ESTOP_REASON_OVERCURRENT = 5;
}

// GPS fix type.
enum GpsFix {
  // Unknown fix type.
  GPS_FIX_UNKNOWN = 0;

  // No fix available.
  GPS_FIX_NONE = 1;

  // 2D fix (latitude/longitude only).
  GPS_FIX_2D = 2;

  // 3D fix (latitude/longitude/altitude).
  GPS_FIX_3D = 3;

  // Differential GPS fix.
  GPS_FIX_DGPS = 4;

  // RTK float solution.
  GPS_FIX_RTK_FLOAT = 5;

  // RTK fixed solution.
  GPS_FIX_RTK_FIXED = 6;
}

// Complete system status information.
message SystemStatus {
  // Overall connection state.
  ConnectionStatus connection_status = 1;

  // Current operating mode.
  RobotMode mode = 2;

  // RX72N motor controller connected.
  bool rx72n_connected = 3;

  // LiDAR sensor connected.
  bool lidar_connected = 4;

  // ROS2 bridge connected.
  bool ros_connected = 5;

  // RX72N firmware version string.
  string firmware_version = 6;

  // System uptime in seconds.
  uint64 uptime_s = 7;

  // Free heap memory in bytes.
  uint32 free_heap_bytes = 8;
}

// Connection state enumeration.
enum ConnectionStatus {
  // Unknown connection state.
  CONNECTION_STATUS_UNKNOWN = 0;

  // Connected and communicating.
  CONNECTION_STATUS_CONNECTED = 1;

  // Not connected.
  CONNECTION_STATUS_DISCONNECTED = 2;

  // Connection in progress.
  CONNECTION_STATUS_CONNECTING = 3;

  // Connection error occurred.
  CONNECTION_STATUS_ERROR = 4;
}

// Robot operating mode enumeration.
enum RobotMode {
  // Unknown operating mode.
  ROBOT_MODE_UNKNOWN = 0;

  // Robot is idle (motors off).
  ROBOT_MODE_IDLE = 1;

  // Manual control mode (joystick/UI).
  ROBOT_MODE_MANUAL = 2;

  // Autonomous navigation mode (Nav2).
  ROBOT_MODE_AUTONOMOUS = 3;

  // SLAM mapping mode.
  ROBOT_MODE_MAPPING = 4;

  // Emergency stop active.
  ROBOT_MODE_EMERGENCY_STOP = 5;
}
