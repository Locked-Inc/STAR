# buf.gen.web.yaml - STAR Code Generation for Gateway / CI
# Excludes nanopb for environments without protoc-gen-nanopb

version: v1

managed:
  enabled: true
  go_package_prefix:
    default: github.com/Locked-Inc/star-proto/gen/go
  optimize_for: SPEED

plugins:
  # ============================================
  # Go for star-gateway (primary language)
  # ============================================
  - plugin: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative

  - plugin: buf.build/grpc/go
    out: gen/go
    opt:
      - paths=source_relative
