# buf.gen.web.yaml - STAR Code Generation for Web/Gateway
# Excludes nanopb for environments without protoc-gen-nanopb

version: v1

managed:
  enabled: true
  go_package_prefix:
    default: github.com/Locked-Inc/star-proto/gen/go
  optimize_for: SPEED

plugins:
  # ============================================
  # Go for star-gateway (primary language)
  # ============================================
  - plugin: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative

  - plugin: buf.build/grpc/go
    out: gen/go
    opt:
      - paths=source_relative

  # ============================================
  # TypeScript for star-ui (protobuf-ts)
  # ============================================
  - plugin: buf.build/community/timostamm-protobuf-ts
    out: gen/typescript
    opt:
      - long_type_string
      - optimize_code_size
      - generate_dependencies
      - ts_nocheck
      - eslint_disable
