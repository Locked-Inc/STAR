# buf.gen.yaml - STAR Code Generation Configuration (buf v1)
# Generates code for Go (primary), TypeScript, and nanopb (C)
#
# STAR Project - Texas A&M University
# December 2025

version: v1

managed:
  enabled: true
  go_package_prefix:
    default: github.com/Locked-Inc/star-proto/gen/go
  optimize_for: SPEED

plugins:
  # ============================================
  # Go for star-gateway (primary language)
  # ============================================
  - plugin: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative

  - plugin: buf.build/grpc/go
    out: gen/go
    opt:
      - paths=source_relative

  # ============================================
  # TypeScript for star-ui (protobuf-ts)
  # ============================================
  - plugin: buf.build/community/timostamm-protobuf-ts
    out: gen/typescript
    opt:
      - long_type_string
      - optimize_code_size
      - generate_dependencies
      - ts_nocheck
      - eslint_disable

  # ============================================
  # C for star-esp32-firmware (nanopb)
  # Note: nanopb requires local installation
  # Install: pip install nanopb
  # ============================================
  - plugin: nanopb
    out: gen/nanopb
    opt:
      - --options-path=nanopb/
    strategy: all

  # ============================================
  # C++ for star-ros2 (ROS2 bridge node)
  # Pinned to v21.12 to match Ubuntu 24.04 (ROS Jazzy) protobuf 3.21.12
  # ============================================
  - plugin: buf.build/protocolbuffers/cpp:v21.12
    out: gen/cpp

  - plugin: buf.build/grpc/cpp:v1.56.2
    out: gen/cpp
