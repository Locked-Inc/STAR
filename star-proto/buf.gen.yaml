# buf.gen.yaml - STAR Code Generation Configuration (buf v1)
# Generates code for Go, TypeScript, Rust, and nanopb (C)
#
# STAR Project - Texas A&M University
# December 2025

version: v1

managed:
  enabled: true
  go_package_prefix:
    default: github.com/Locked-Inc/star-proto/gen/go
  optimize_for: SPEED

plugins:
  # ============================================
  # Go for star-gateway (primary language)
  # ============================================
  - plugin: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative

  - plugin: buf.build/grpc/go
    out: gen/go
    opt:
      - paths=source_relative

  # ============================================
  # TypeScript for star-ui (protobuf-ts)
  # ============================================
  - plugin: buf.build/community/timostamm-protobuf-ts
    out: gen/typescript
    opt:
      - long_type_string
      - optimize_code_size
      - generate_dependencies
      - ts_nocheck
      - eslint_disable

  # ============================================
  # Rust for star-bms-tool (prost)
  # ============================================
  - plugin: buf.build/community/neoeinstein-prost
    out: gen/rust

  # ============================================
  # C for star-esp32-firmware (nanopb)
  # Note: nanopb requires local installation
  # Install: pip install nanopb
  # ============================================
  - plugin: nanopb
    out: gen/nanopb
    opt:
      - --options-path=nanopb/
    strategy: all
