# CPPLINT Configuration for STAR ROS2 Packages
# Aligns with CI/CD linting standards

# Set filters (- = disable, + = enable)
filter=-build/c++11
filter=-whitespace/braces
filter=-whitespace/indent
filter=-whitespace/comments
filter=-whitespace/newline
filter=-runtime/references
filter=-readability/todo

# Copyright is checked by ament_copyright instead
filter=-legal/copyright

# Header guards - ROS2 uses double underscore style
# We'll allow both single and double underscore for compatibility
set noparent

# Line length
linelength=120

# Root directory for header guard calculation
# (ament_cpplint sets this automatically per package)
