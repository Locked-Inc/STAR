# STAR Robot WiFi Access Point Configuration
# This file configures the Pi 5 as a WiFi hotspot for ESP32 devices

# Interface - virtual AP interface created by wifi-ap-setup.service
interface=uap0
driver=nl80211

# Wireless settings
ssid=STAR-Robot-AP
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

# Country code (adjust for your region: US, GB, DE, etc.)
country_code=US

# Authentication - WPA2
wpa=2
wpa_passphrase=starrobot123
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP

# Maximum connected clients
max_num_sta=10

# Logging
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2

# Control interface for hostapd_cli
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0
