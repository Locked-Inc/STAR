# OPKG Configuration for STAR Robot OS
#
# Note: opkg requires a package repository. By default, there's no
# pre-configured repository for custom Buildroot builds.
#
# Options:
# 1. Set up your own package repository server
# 2. Use Entware for ARM64: https://bin.entware.net/aarch64-k3.10/
# 3. Build packages locally with Buildroot

# Destination directories
dest root /
dest ram /tmp

# Architecture priority (aarch64 = ARM 64-bit)
arch aarch64 100
arch all 50
arch any 1

# Entware repository for ARM64
# Note: Entware packages may have different library dependencies
src/gz entware https://bin.entware.net/aarch64-k3.10

# Local package directory (for manually added .ipk files)
# src/gz local file:///opt/packages

# Options
option autoremove 1
option check_signature 0
