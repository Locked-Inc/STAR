name: Build STAR-Z2 PYNQ Image

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'pynq-image/**'
      - '.github/workflows/build-image.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pynq-image/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    timeout-minutes: 360  # 6 hours max

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: recursive
        lfs: true

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo apt-get clean
        df -h

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential libncurses5-dev \
          zlib1g-dev gawk flex bison libssl-dev bc python3-pip \
          chrpath socat cpio python3-pexpect xz-utils debianutils \
          iputils-ping python3-git python3-jinja2 libegl1-mesa \
          libsdl1.2-dev pylint3 xterm git-lfs

    - name: Cache build artifacts
      uses: actions/cache@v3
      with:
        path: |
          pynq-image/PYNQ/sdbuild/build
          pynq-image/PYNQ/sdbuild/downloads
        key: ${{ runner.os }}-pynq-build-${{ hashFiles('pynq-image/board-config/**') }}
        restore-keys: |
          ${{ runner.os }}-pynq-build-

    - name: Setup build environment
      run: |
        cd pynq-image
        source ./scripts/setup-env.sh

    # Note: Full builds require Xilinx tools which aren't available in CI
    # This workflow validates the configuration but doesn't produce images
    - name: Validate board configuration
      run: |
        cd pynq-image
        if [ -f "board-config/STAR-Z2/STAR-Z2.spec" ]; then
          echo "Board configuration found"
          cat board-config/STAR-Z2/STAR-Z2.spec
        else
          echo "ERROR: Board configuration missing"
          exit 1
        fi

    - name: Upload configuration
      uses: actions/upload-artifact@v3
      with:
        name: star-z2-config
        path: pynq-image/board-config/
        retention-days: 30

    # Uncomment when Xilinx tools are available (self-hosted runner)
